bgp:
  advertise_loopback: true
  community:
    ebgp:
    - standard
    ibgp:
    - standard
    - extended
  next_hop_self: true
groups:
  as65001:
    members:
    - r1
  as65002:
    members:
    - r2
input:
- coverage/input/plugin-dict.yml
- package:topology-defaults.yml
links:
- _linkname: links[1]
  interfaces:
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.1/30
    node: r1
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.2/30
    node: r2
  linkindex: 1
  node_count: 2
  prefix:
    ipv4: 10.1.0.0/30
  role: external
  type: p2p
module:
- bgp
name: input
nodes:
  r1:
    af:
      ipv4: true
    bgp:
      advertise:
      - ipv4: 10.0.0.1/32
      advertise_loopback: true
      as: 65001
      community:
        ebgp:
        - standard
        ibgp:
        - standard
        - extended
        localas_ibgp:
        - standard
        - extended
      ipv4: true
      neighbors:
      - activate:
          ipv4: true
        as: 65002
        ifindex: 1
        ipv4: 10.1.0.2
        name: r2
        type: ebgp
      next_hop_self: true
      router_id: 10.0.0.1
    box: none
    device: none
    id: 1
    interfaces:
    - ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.1/30
      linkindex: 1
      name: r1 -> r2
      neighbors:
      - ifname: eth1
        ipv4: 10.1.0.2/30
        node: r2
      role: external
      type: p2p
    loopback:
      bgp:
        advertise: true
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    module:
    - bgp
    name: r1
  r2:
    af:
      ipv4: true
    bgp:
      advertise:
      - ipv4: 10.0.0.2/32
      advertise_loopback: true
      as: 65002
      community:
        ebgp:
        - standard
        ibgp:
        - standard
        - extended
        localas_ibgp:
        - standard
        - extended
      ipv4: true
      neighbors:
      - activate:
          ipv4: true
        as: 65001
        ifindex: 1
        ipv4: 10.1.0.1
        name: r1
        type: ebgp
      next_hop_self: true
      router_id: 10.0.0.2
    box: none
    device: none
    id: 2
    interfaces:
    - ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.2/30
      linkindex: 1
      name: r2 -> r1
      neighbors:
      - ifname: eth1
        ipv4: 10.1.0.1/30
        node: r1
      role: external
      type: p2p
    loopback:
      bgp:
        advertise: true
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.2/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.102
      mac: ca:fe:00:02:00:00
    module:
    - bgp
    name: r2
plugin:
- bgp.session
- ebgp.multihop
provider: libvirt
