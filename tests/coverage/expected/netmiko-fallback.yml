input:
- coverage/input/netmiko-fallback.yml
- package:topology-defaults.yml
links:
- _linkname: links[1]
  interfaces:
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.1/30
    node: a
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.2/30
    node: b
  linkindex: 1
  node_count: 2
  prefix:
    ipv4: 10.1.0.0/30
  type: p2p
message: This topology tests netmiko fallback
name: input
nodes:
  a:
    _node_config:
      initial: :netmiko
    af:
      ipv4: true
    box: none
    clab:
      config_templates:
      - mode: netmiko
        source: initial
        target: ''
    device: none
    hostname: clab-input-a
    id: 1
    interfaces:
    - ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.1/30
      linkindex: 1
      name: a -> b
      neighbors:
      - ifname: eth1
        ipv4: 10.1.0.2/30
        node: b
      type: p2p
    loopback:
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    name: a
    netlab_ansible_skip_module:
    - initial
    netlab_config_mode: netmiko
  b:
    af:
      ipv4: true
    box: none
    device: none
    hostname: clab-input-b
    id: 2
    interfaces:
    - ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.2/30
      linkindex: 1
      name: b -> a
      neighbors:
      - ifname: eth1
        ipv4: 10.1.0.1/30
        node: a
      type: p2p
    loopback:
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.2/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.102
      mac: ca:fe:00:02:00:00
    name: b
provider: clab
