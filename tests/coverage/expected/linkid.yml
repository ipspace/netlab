input:
- coverage/input/linkid.yml
- package:topology-defaults.yml
links:
- _linkname: links[1]
  interfaces:
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.1/30
    node: a
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.2/30
    linkid: b_only
    node: b
  linkid: first
  linkindex: 1
  node_count: 2
  prefix:
    ipv4: 10.1.0.0/30
  type: p2p
- _linkname: links[2]
  bridge: input_2
  interfaces:
  - _vlan_mode: irb
    ifindex: 2
    ifname: eth2
    ipv4: 172.16.0.1/24
    node: a
    vlan:
      access: red
  - _vlan_mode: irb
    ifindex: 2
    ifname: eth2
    ipv4: 172.16.0.2/24
    node: b
    vlan:
      access: red
  - _vlan_mode: irb
    ifindex: 1
    ifname: eth1
    ipv4: 172.16.0.3/24
    node: c
    vlan:
      access: red
  linkid: red_access
  linkindex: 2
  node_count: 3
  prefix:
    allocation: id_based
    ipv4: 172.16.0.0/24
  type: lan
  vlan:
    access: red
- _linkname: links[3]
  bridge: input_3
  interfaces:
  - _vlan_mode: irb
    ifindex: 3
    ifname: eth3
    ipv4: 172.16.1.1/24
    node: a
    vlan:
      access: blue
  - _vlan_mode: irb
    ifindex: 3
    ifname: eth3
    ipv4: 172.16.1.2/24
    node: b
    vlan:
      access: blue
  - _vlan_mode: irb
    ifindex: 2
    ifname: eth2
    ipv4: 172.16.1.3/24
    node: c
    vlan:
      access: blue
  linkid: blue_access
  linkindex: 3
  node_count: 3
  prefix:
    allocation: id_based
    ipv4: 172.16.1.0/24
  type: lan
  vlan:
    access: blue
- _linkname: links[4]
  interfaces:
  - ifindex: 4
    ifname: eth4
    node: a
    vlan:
      trunk:
        blue: {}
        red: {}
  - ifindex: 4
    ifname: eth4
    node: b
    vlan:
      trunk:
        blue: {}
        red: {}
  linkid: vlan_trunk
  linkindex: 4
  node_count: 2
  prefix: {}
  type: p2p
  vlan:
    trunk:
      blue: {}
      red: {}
module:
- vlan
