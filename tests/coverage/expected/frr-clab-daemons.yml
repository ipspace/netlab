        target: /etc/config/01-initial.sh
      - mode: sh
        source: ospf
        target: /etc/config/02-ospf.sh
      - mode: sh
        source: bgp
        target: /etc/config/03-bgp.sh
      - mode: shared
        source: hosts
        target: /etc/hosts
      daemons:
      - zebra
      - ospfd
      - ospf6d
      - bgpd
      - pimd
      exec:
      - sleep 1
      kind: frr
    device: frr
    frr:
      daemons:
      - pimd
      - bgpd
    hostname: clab-input-r2
    id: 2
    interfaces:
    - ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.2/30
      linkindex: 1
      mtu: 1500
      name: r2 -> r1
      neighbors:
