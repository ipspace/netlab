        ipv4: 10.1.0.1/30
        node: r1
      ospf:
        area: 0.0.0.0
        network_type: point-to-point
        passive: false
      type: p2p
    - ifindex: 2
      ifname: eth2
      ipv4: 10.1.0.5/30
      linkindex: 2
      mtu: 1500
      name: r2 -> r3
      neighbors:
      - ifname: eth1
        ipv4: 10.1.0.6/30
        node: r3
      ospf:
        area: 0.0.0.0
        network_type: point-to-point
        passive: false
      type: p2p
    loopback:
      bgp:
        advertise: true
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.2/32
      neighbors: []
      ospf:
        area: 0.0.0.0
        passive: false
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.102
      mac: ca:fe:00:02:00:00
    module:
