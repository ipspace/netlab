groups:
  hosts:
    members:
    - h1
    - h2
    node_data:
      role: host
input:
- coverage/input/acl-vlan.yml
- package:topology-defaults.yml
links:
- _linkname: vlans.tenant.links[1]
  bridge: input_1
  interfaces:
  - ifindex: 1
    ifname: eth1
    ipv4: 172.16.0.3/24
    node: h1
  - _vlan_mode: irb
    ifindex: 1
    ifname: eth1
    ipv4: 172.16.0.1/24
    node: r1
    routing:
      acl:
        in: icmp
    vlan:
      access: tenant
  linkindex: 1
  node_count: 2
  prefix:
    allocation: id_based
    ipv4: 172.16.0.0/24
  routing:
    acl:
      in: tcp
  type: lan
  vlan:
    access: tenant
- _linkname: vlans.tenant.links[2]
  bridge: input_2
  interfaces:
  - _vlan_mode: irb
    ifindex: 2
    ifname: eth2
    ipv4: 172.16.0.1/24
    node: r1
    routing:
      acl:
        in: icmp
    vlan:
      access: tenant
  - _vlan_mode: irb
    ifindex: 1
    ifname: eth1
    ipv4: 172.16.0.2/24
    node: r2
    vlan:
      access: tenant
  linkindex: 2
  node_count: 2
  prefix:
    allocation: id_based
    ipv4: 172.16.0.0/24
  routing:
    acl:
      in: tcp
  type: lan
  vlan:
    access: tenant
- _linkname: vlans.tenant.links[3]
  bridge: input_3
  interfaces:
  - _vlan_mode: irb
    ifindex: 2
    ifname: eth2
    ipv4: 172.16.0.2/24
    node: r2
    vlan:
      access: tenant
  - ifindex: 1
    ifname: eth1
    ipv4: 172.16.0.4/24
    node: h2
  linkindex: 3
  node_count: 2
  prefix:
    allocation: id_based
    ipv4: 172.16.0.0/24
  routing:
    acl:
      in: tcp
  type: lan
  vlan:
    access: tenant
module:
- vlan
- routing
name: input
nodes:
  h1:
    af:
      ipv4: true
    box: none
    device: none
    id: 3
    interfaces:
    - bridge: input_1
      gateway:
        ipv4: 172.16.0.1/24
      ifindex: 1
      ifname: eth1
      ipv4: 172.16.0.3/24
      linkindex: 1
      name: h1 -> [r1,h2,r2]
      neighbors:
      - ifname: Vlan1000
        ipv4: 172.16.0.1/24
        node: r1
        routing:
          acl:
            in: icmp
        vlan:
          mode: irb
          name: tenant
      - ifname: eth1
        ipv4: 172.16.0.4/24
        node: h2
      - ifname: Vlan1000
        ipv4: 172.16.0.2/24
        node: r2
        routing:
          acl:
            in: tcp
        vlan:
          mode: irb
          name: tenant
      type: lan
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.103
      mac: ca:fe:00:03:00:00
    module:
    - routing
    name: h1
    role: host
    routing:
      static:
      - ipv4: 0.0.0.0/0
        nexthop:
          idx: 0
          intf: eth1
          ipv4: 172.16.0.1
  h2:
    af:
      ipv4: true
    box: none
    device: none
    id: 4
    interfaces:
    - bridge: input_3
      gateway:
        ipv4: 172.16.0.1/24
      ifindex: 1
      ifname: eth1
      ipv4: 172.16.0.4/24
      linkindex: 3
      name: h2 -> [h1,r1,r2]
      neighbors:
      - ifname: eth1
        ipv4: 172.16.0.3/24
        node: h1
      - ifname: Vlan1000
        ipv4: 172.16.0.1/24
        node: r1
        routing:
          acl:
            in: icmp
        vlan:
          mode: irb
          name: tenant
      - ifname: Vlan1000
        ipv4: 172.16.0.2/24
        node: r2
        routing:
          acl:
            in: tcp
        vlan:
          mode: irb
          name: tenant
      type: lan
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.104
      mac: ca:fe:00:04:00:00
    module:
    - routing
    name: h2
    role: host
    routing:
      static:
      - ipv4: 0.0.0.0/0
        nexthop:
          idx: 0
          intf: eth1
          ipv4: 172.16.0.1
  r1:
    af:
      ipv4: true
    box: none
    device: none
    id: 1
    interfaces:
    - bridge: input_1
      ifindex: 1
      ifname: eth1
      linkindex: 1
      name: '[Access VLAN tenant] r1 -> h1'
      neighbors:
      - ifname: eth1
        ipv4: 172.16.0.3/24
        node: h1
      type: lan
      vlan:
        access: tenant
        access_id: 1000
    - bridge: input_2
      ifindex: 2
      ifname: eth2
      linkindex: 2
      name: '[Access VLAN tenant] r1 -> r2'
      neighbors:
      - ifname: eth1
        ipv4: 172.16.0.2/24
        node: r2
      type: lan
      vlan:
        access: tenant
        access_id: 1000
    - bridge_group: 1
      ifindex: 40000
      ifname: Vlan1000
      ipv4: 172.16.0.1/24
      name: VLAN tenant (1000) -> [h1,h2,r2]
      neighbors:
      - ifname: eth1
        ipv4: 172.16.0.3/24
        node: h1
      - ifname: eth1
        ipv4: 172.16.0.4/24
        node: h2
      - ifname: Vlan1000
        ipv4: 172.16.0.2/24
        node: r2
        routing:
          acl:
            in: tcp
        vlan:
          mode: irb
          name: tenant
      routing:
        acl:
          in:
            ipv4: icmp
      type: svi
      virtual_interface: true
      vlan:
        mode: irb
        name: tenant
    loopback:
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    module:
    - vlan
    - routing
    name: r1
    routing:
      _acl:
        ipv4:
          icmp:
          - action: permit
            dst:
              any: true
              ipv4: 0.0.0.0/0
            protocol: icmp
            sequence: 100
            src:
              any: true
              ipv4: 0.0.0.0/0
      acl:
        icmp:
        - action: permit
          dst:
            ipv4:
            - 0.0.0.0/0
            ipv6:
            - ::/0
          protocol: icmp
          sequence: 10
          src:
            ipv4:
            - 0.0.0.0/0
            ipv6:
            - ::/0
    vlan:
      max_bridge_group: 1
    vlans:
      tenant:
        bridge_group: 1
        id: 1000
        mode: irb
        prefix:
          allocation: id_based
          ipv4: 172.16.0.0/24
        routing:
          acl:
            in: icmp
  r2:
    af:
      ipv4: true
    box: none
    device: none
    id: 2
    interfaces:
    - bridge: input_2
      ifindex: 1
      ifname: eth1
      linkindex: 2
      name: '[Access VLAN tenant] r2 -> r1'
      neighbors:
      - ifname: eth2
        ipv4: 172.16.0.1/24
        node: r1
      type: lan
      vlan:
        access: tenant
        access_id: 1000
    - bridge: input_3
      ifindex: 2
      ifname: eth2
      linkindex: 3
      name: '[Access VLAN tenant] r2 -> h2'
      neighbors:
      - ifname: eth1
        ipv4: 172.16.0.4/24
        node: h2
      type: lan
      vlan:
        access: tenant
        access_id: 1000
    - bridge_group: 1
      ifindex: 40000
      ifname: Vlan1000
      ipv4: 172.16.0.2/24
      name: VLAN tenant (1000) -> [h1,r1,h2]
      neighbors:
      - ifname: eth1
        ipv4: 172.16.0.3/24
        node: h1
      - ifname: Vlan1000
        ipv4: 172.16.0.1/24
        node: r1
        routing:
          acl:
            in: icmp
        vlan:
          mode: irb
          name: tenant
      - ifname: eth1
        ipv4: 172.16.0.4/24
        node: h2
      routing:
        acl:
          in:
            ipv4: tcp
      type: svi
      virtual_interface: true
      vlan:
        mode: irb
        name: tenant
    loopback:
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.2/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.102
      mac: ca:fe:00:02:00:00
    module:
    - vlan
    - routing
    name: r2
    routing:
      _acl:
        ipv4:
          tcp:
          - action: permit
            dst:
              any: true
              ipv4: 0.0.0.0/0
            protocol: tcp
            sequence: 100
            src:
              any: true
              ipv4: 0.0.0.0/0
      acl:
        tcp:
        - action: permit
          dst:
            ipv4:
            - 0.0.0.0/0
            ipv6:
            - ::/0
          protocol: tcp
          sequence: 10
          src:
            ipv4:
            - 0.0.0.0/0
            ipv6:
            - ::/0
    vlan:
      max_bridge_group: 1
    vlans:
      tenant:
        bridge_group: 1
        id: 1000
        mode: irb
        prefix:
          allocation: id_based
          ipv4: 172.16.0.0/24
        routing:
          acl:
            in: tcp
prefix:
  any:
    ipv4: 0.0.0.0/0
    ipv6: ::/0
provider: libvirt
routing:
  acl:
    icmp:
    - action: permit
      dst:
        ipv4:
        - 0.0.0.0/0
        ipv6:
        - ::/0
      protocol: icmp
      sequence: 10
      src:
        ipv4:
        - 0.0.0.0/0
        ipv6:
        - ::/0
    tcp:
    - action: permit
      dst:
        ipv4:
        - 0.0.0.0/0
        ipv6:
        - ::/0
      protocol: tcp
      sequence: 10
      src:
        ipv4:
        - 0.0.0.0/0
        ipv6:
        - ::/0
vlans:
  tenant:
    host_count: 2
    id: 1000
    neighbors:
    - ifname: eth1
      ipv4: 172.16.0.3/24
      node: h1
    - ifname: Vlan1000
      ipv4: 172.16.0.1/24
      node: r1
      routing:
        acl:
          in: icmp
      vlan:
        mode: irb
        name: tenant
    - ifname: eth1
      ipv4: 172.16.0.4/24
      node: h2
    - ifname: Vlan1000
      ipv4: 172.16.0.2/24
      node: r2
      routing:
        acl:
          in: tcp
      vlan:
        mode: irb
        name: tenant
    prefix:
      allocation: id_based
      ipv4: 172.16.0.0/24
    routing:
      acl:
        in: tcp
