input:
- coverage/input/tools-plugin.yml
- package:topology-defaults.yml
name: input
nodes:
  r1:
    af:
      ipv4: true
    box: none
    device: none
    id: 1
    interfaces: []
    loopback:
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    name: r1
plugin:
- tool_plugin
provider: libvirt
tools:
  plugin_test:
    docker:
      up: echo "input tool started by plugin"
    runtime: docker
