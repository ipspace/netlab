#
# Device without multi-topology IS-IS support (isis.mt feature) cannot
# interoperate with other devices when running IS-IS over IPv6
#
module: [ isis, vrf ]
defaults.device: none
addressing.p2p.ipv6: 2001:db8:1::/48
addressing.loopback.ipv6: 2001:db8:0::/48
addressing.vrf_loopback.ipv6: 2001:db8:2::/48

vrfs:
  red:

nodes:
  r1:                             # Global IPv6 IS-IS instance
    _features.isis.mt: False
  r2:                             # VRF IPv6 IS-IS instance
    _features.isis.mt: False
    loopback.ipv6: False
  r3:                             # IPv4-only, no error
    _features.isis.mt: False
    loopback.ipv6: False
  r4:

links:
- r1-r4
- interfaces: [ r2, r4 ]
  vrf: red
- interfaces: [ r3, r4 ]
  prefix.ipv4: 172.16.33.0/24
