#
# Inter-VRF route leaking on a device that cannot do it (r1, error) and
# on a device that can (r2, no error)
#
module: [ vrf ]

defaults.devices.eos.features.vrf.leaking: False

vrfs:
  red:
    import: [ red, blue ]
  blue:

nodes:
  r1:
    device: eos
  r2:
    device: frr

links:
- r1:
  r2:
  vrf: red
