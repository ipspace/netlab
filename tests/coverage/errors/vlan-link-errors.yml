#
# Code coverage test for VLAN link attribute errors (displaying link data)
#
defaults.device: none
module: [ vlan ]

vlans:
  red:
  blue:
  green:

nodes: [ s1, s2 ]

links:
- s1:                           # VLAN attribute must be a dictionary
  s2:
  vlan: 10
- s1:                           # Unknown VLAN attribute
  s2:
  vlan.foo: red
- s1:                           # VLAN attribute of a wrong type
  s2:
  vlan.access: [ red ]
- s1:                           # Cannot mix trunk and access VLANs
  s2:
  vlan:
    access: red
    trunk: [ blue ]
- s1:                           # Native VLAN without a trunk
  s2:
  vlan.native: red
- s1:                           # Native VLAN not in the trunk
  s2:
  vlan:
    trunk: [ red, blue ]
    native: green
- s1:                           # Node native VLAN not in its trunk
    vlan.trunk: [ red, blue ]
    vlan.native: red
  s2:
    vlan.trunk: [ blue ]
    vlan.native: red
- s1:                           # Native VLAN in the trunk of a node that does not use it as native VLAN
    vlan.trunk: [ red, blue ]
    vlan.native: red
  s2:
    vlan.trunk: [ red, blue ]
