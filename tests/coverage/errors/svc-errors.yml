message: |
  Generate as many errors in the services module as possible

defaults:
  device: none
  vrf.warnings.inactive: False

provider: clab

module: [ services ]

services.dns.server: [ dns_s1, dns_s2 ]

vrfs:
  tenant:

nodes:
  dns_c1:
    module: [ services, vrf ]
    services.dns.transport_vrf: missing
  dns_c2:
    module: [ services, vrf ]
    _features.services: False
    services.dns.transport_vrf: tenant
  dns_s1:
    services.server.dns: True
    loopback: False
  dns_s2:
    loopback: False

links:
- dns_c1:
    ipv6: False
  dns_c2:
    vrf: tenant
  dns_s1:
    ipv4: False
  dns_s2:
  prefix:
    ipv4: 172.16.0.0/24
    ipv6: 2001:db8::/64
