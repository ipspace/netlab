module: [ isis, sr ]
defaults.device: none

defaults.attributes.node:
  no_empty:
    type: list
    _subtype:
      type: list
      create_empty: False
  not_empty:
    type: list
    _subtype:
      type: list
      empty: False
  empty:
    type: list
    _subtype:
      type: list
      empty: True
      create_empty: False
  regular:
    type: list
    _subtype: list
  regular_force:
    type: list
    _subtype:
      type: list
      make_list: True
  min2:
    type: list
    _subtype:
      type: list
      min_length: 2
  max3:
    type: list
    _subtype:
      type: list
      max_length: 3
nodes:
  n1:
    no_empty:
    - Null              # Invalid, will not create an empty list
    - a
    - [ a ]
    not_empty:
    - Null              # Invalid, the list cannot be empty
    - False
    - a
    - []                # Invalid, the list cannot be empty
    - [ b ]
    empty:
    - Null              # Invalid, empty list is not created
    - False             # ... but it can have a single False element
    - []
    - a
    - [ b ]
    regular:
    - a
    - [ b ]
    - { c: d }          # Dict cannot be turned into a list
    regular_force:      # Everything OK, dict is forced into a list
    - Null
    - a
    - [ b ]
    - { c: d }
    min2:
    - a                 # Cannot convert scalar into list with at least 2 elements
    - [ a ]             # Too short
    - [ a, b ]
    max3:
    - a
    - [ a ]
    - [ a, b, c, d ]    # Too long
