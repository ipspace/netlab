#
# Device without EIGRP IPv4 or IPv6 address family support (eigrp.ipv4/eigrp.ipv6
# features) cannot run EIGRP for that address family
#
module: [ eigrp ]
defaults.device: none
addressing.p2p.ipv6: 2001:db8:1::/48

nodes:
  r1:
    _features.eigrp.ipv6: False
  r2:
    _features.eigrp.ipv4: False

links: [ r1-r2 ]
