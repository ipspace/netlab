#
# Code coverage test for 'valid_values' with string and non-string data types
#
# Node 'a' has valid values, all other nodes have invalid values
#
defaults.device: none

defaults.attributes.node:
  v_str: { type: str, valid_values: [ red, blue ] }
  v_int: { type: int, valid_values: [ 1, 2, 4 ] }
  v_float: { type: float, valid_values: [ 0.5, 1.5 ] }
  v_list: { type: list, valid_values: [ red, 0, True ] }

nodes:
  a:
    v_str: red
    v_int: "2"                  # Numeric string is converted into a valid integer
    v_float: 1.5
    v_list: [ red, 0, True, 0.0 ]       # 0.0 is equal to 0
  b:                            # Values not in the list of valid values
    v_str: green
    v_int: 3
    v_float: 2.5
    v_list: [ blue, 2 ]
  c:                            # Non-string values
    v_str: 1                    # Rejected by the 'str' data type check
    v_list: [ 7, red, 2.5 ]
  d:                            # Booleans are not equal to integers
    v_list: [ False, 1 ]        # False == 0 and True == 1 in Python
