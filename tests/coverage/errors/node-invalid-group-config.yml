#
# Node group names and configuration templates must be strings
#
defaults.device: none

groups:
  g1:
    members: [ r1 ]

nodes:
  r1:
    group: [ g1, 1 ]            # Invalid group name, would crash the group setup
  r2:
    group: g1                   # A string is converted into a list
    config: [ x, 1 ]            # Invalid configuration template
  r3:
    config: x
