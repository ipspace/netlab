#
# A device that cannot configure IPv6 addresses (initial.ipv6: False) cannot
# have IPv6 addresses on loopback or regular interfaces (or LLA-only interfaces).
# The error is reported once per node.
#
defaults.device: none
addressing.loopback.ipv6: 2001:db8:0::/48
addressing.p2p.ipv6: 2001:db8:1::/48

nodes:
  r1:
    _features.initial.ipv6: False
  r2:
    _features.initial.ipv6: False
    loopback.ipv6: False
  r3:

links:
- r1-r3
- r1:
  r3:
  prefix.ipv6: True
- r2-r3
