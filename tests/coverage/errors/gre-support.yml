---
message: |
  Test the GRE tunnel.source options

plugin: [ tunnel.gre ]
defaults.device: none

nodes:
  r1:
    _features.tunnel:
  r2:
    _features.tunnel.gre: [ ipv4 ]
  r3:
    _features.tunnel.gre: [ ipv4, ipv6 ]

links:
- r1-r2
- r2-r3
- r1:
  r2:
  tunnel.mode: gre
- r2:
    tunnel.vrf: tenant
  r3:
    tunnel.source.linkid: uplink6
  tunnel.mode: gre
  tunnel.af: ipv6
