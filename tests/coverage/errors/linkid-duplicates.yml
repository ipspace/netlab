defaults.device: none
defaults.vlan.warnings.trunk_attribute: False

module: [ vlan ]

vlans:
  red:
  blue:
    linkid: blue

nodes:
  a:
  b:
  c:
    vlans:
      red:
        linkid: red_c

links:
- linkid: first
  a:
  b:
    linkid: b_only
- interfaces: [ a, b, c ]
  vlan.access: red
  linkid: red
- interfaces: [ a, b, c ]
  vlan.access: blue
  linkid: blue_access
- interfaces: [ a, b ]
  vlan.trunk: [ red, blue ]
  linkid: vlan_trunk
- interfaces: [ b, c ]
  vlan.trunk: [ red, blue ]
  linkid: vlan_trunk
- b.linkid: b_only
