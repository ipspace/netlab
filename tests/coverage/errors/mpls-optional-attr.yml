#
# Optional LDP/BGP-LU attributes require the corresponding mpls.ldp.* or mpls.bgp.* device features
#

defaults.device: none

module: [ ospf, bgp, mpls ]
bgp.as: 65000

nodes:
  r1:
    _features.mpls:
      ldp: True
      bgp: True
    mpls.ldp:
      explicit_null: True
      igp_sync: True
    mpls.bgp:
      explicit_null: True
      disable_unlabeled: True
  r2:

links: [ r1-r2 ]
