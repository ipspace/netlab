#
# Code coverage test for the 'asn' and 'asn2' validators
#
# Nodes r1, r6, and r7 have valid values, all other nodes have invalid values
#
module: [ bgp ]
defaults.device: none

defaults.attributes.node.as2: asn2

nodes:
  r1:
    bgp.as: 65000
    as2: 65000
  r2:
    bgp.as: wrong
    as2: wrong
  r3:
    bgp.as: True
  r4:
    bgp.as: []
  r5:
    bgp.as:
  r6:
    bgp.as: 123456
  r7:
    bgp.as: "1.2"                 # Valid asdot ASN
  r8:                             # Out-of-range values
    bgp.as: 0
    as2: 0
  r9:
    bgp.as: 4294967296
    as2: 65536
  r10:                            # Invalid asdot values
    bgp.as: "1.2.3"
  r11:
    bgp.as: "70000.1"
  r12:
    bgp.as: "0.0"
