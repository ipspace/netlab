defaults:
  device: cumulus

defaults.groups:
  g1:
    config: [ OK, 1 ]                   # Config templates must be strings
    node_data: True
  g2:
    config:
      hey: Wrong
    bgp.as: 65000                       # BGP module not used by G2
    node_data: wrong

nodes:
  a:
  b:

groups:
  g1:
    members: [ a, b ]
    bgp.as: 65000                       # Invalid module
    foo: 13                             # Invalid node attribute
    config:                             # Config must be list
      x: 1
      y: 2
  g2:
    members: [ a ]
    module: [ ospf ]
    ospf.area: 42
    node_data: 1                        # node_data must be a dictionary
