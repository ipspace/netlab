#
# Code coverage test for the 'int' and 'float' validators
#
# Node 'a' has valid values, all other nodes have invalid values
#
defaults.device: none

defaults.attributes.node:
  n_min: { type: int, min_value: 10 }
  n_max: { type: int, max_value: 10 }
  n_range: { type: int, min_value: 10, max_value: 20 }
  f_range: { type: float, min_value: 0, max_value: 100 }

nodes:
  a:
    id: "10"                    # Numeric string, constant max_value (MAX_NODE_ID)
    n_min: 10
    n_max: "10"
    n_range: "15"
    f_range: "2.5"
  b:                            # Out-of-range numeric strings
    id: "1000"
    n_min: "5"
    n_max: "15"
    n_range: "25"
    f_range: "150"
  c:                            # Out-of-range numbers
    n_min: 5
    n_max: 15
    n_range: 5
    f_range: -1.5
  d:                            # Invalid data types
    n_min: x
    n_max: True
    n_range: [ 15 ]
    f_range: "2.5x"
