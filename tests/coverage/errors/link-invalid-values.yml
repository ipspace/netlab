#
# Invalid link attribute values must be reported, not crash the bridge
# expansion or the MLAG peer group ID setup
#
defaults.device: none
module: [ vlan, lag ]

nodes: [ r1, r2, r3 ]

links:
- r1:
  r2:
  bridge: [ br1 ]               # Bridge name must be an identifier
- lag.members: [ r1-r3 ]
  lag.mlag.peergroup: [ 1 ]     # Peer group must be an integer
