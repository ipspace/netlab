#
# A device can disable a module it supports with a specific provider
# (r1 uses the disabled provider, r2 does not)
#
module: [ vrf ]
defaults.device: none
provider: libvirt
defaults.devices.none.clab.features.vrf: False

nodes:
  r1:
    provider: clab
    vrfs:
      red:
  r2:
    vrfs:
      red:
