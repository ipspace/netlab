#
# A device can disable a module it supports with a specific provider
# (r1 uses the disabled provider, r2 does not), and a child provider
# inherits the disabled module from its parent provider (r3)
#
module: [ vrf ]
defaults.device: none
provider: libvirt
defaults.devices.none.clab.features.vrf: False
defaults.providers.kube.parent: clab
defaults.providers.libvirt.kube: {}

nodes:
  r1:
    provider: clab
    vrfs:
      red:
  r2:
    vrfs:
      red:
  r3:
    provider: kube
    vrfs:
      red:
