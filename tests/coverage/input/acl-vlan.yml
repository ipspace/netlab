---
defaults.sources.extra: [ ../warnings.yml ]
defaults.device: none
module: [ routing, vlan ]

groups:
  hosts:
    members: [ h1, h2 ]
    role: host

routing.acl:
  icmp:
  - action: permit
    protocol: icmp
  tcp:
  - action: permit
    protocol: tcp

vlans:
  tenant:
    routing.acl.in: tcp
    links: [ h1-r1, r1-r2, r2-h2 ]

nodes:
  r1:
    vlans:
      tenant:
        routing.acl.in: icmp
  r2:
  h1:
  h2:
