---
message: |
  Test the GRE tunnel.source options

plugin: [ tunnel.gre ]
defaults.device: none

nodes:
  r1:
    provider: clab
  r2:
    provider: libvirt

links:
- r1:
  r2:
  linkid: uplink
- r1:
  r2:
    role: mobile
  role: backup
- r1:
  r2:
  tunnel.mode: gre
  tunnel.source.linkid: uplink
- r1:
    tunnel.source.link.role: backup
  r2:
    tunnel.source.link.role: mobile
  tunnel.mode: gre
