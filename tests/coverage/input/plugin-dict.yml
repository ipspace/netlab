#
# Plugins can be specified in a dictionary (converted into a list of
# plugin names). Plugins with False values are skipped.
#
defaults.device: none

plugin:
  bgp.session: True
  ebgp:
    multihop: True
  files: False

module: [ bgp ]

nodes:
  r1:
    bgp.as: 65001
  r2:
    bgp.as: 65002

links: [ r1-r2 ]
