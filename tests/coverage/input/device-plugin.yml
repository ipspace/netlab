#
# Check that the plugins required by used devices are loaded:
#
# * The plugin is inherited from the parent device
# * The device is specified in a default group
# * The device is specified in a topology component
# * The plugins of unused devices are not loaded
#
defaults.device: none
defaults.devices.dp_base:
  parent: none
  description: Device with a plugin
  plugin: device_plugin
defaults.devices.dp_child:
  parent: dp_base
  description: Device inheriting a plugin
defaults.devices.dp_unused:
  parent: none
  description: Unused device with a plugin
  plugin: no_such_plugin
defaults.devices.dp_comp:
  parent: none
  description: Device used in a component
  plugin: device_comp_plugin

components:
  pod:
    device: dp_comp
    nodes: [ x ]

defaults.groups:
  g1:
    members: [ r2 ]
    device: dp_child

nodes:
  r1:
  r2:
  p1:
    include: pod
