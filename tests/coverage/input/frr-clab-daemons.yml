#
# Generate containerlab 'daemons' list for FRR nodes from netlab modules and frr.daemons
#
provider: clab
defaults:
  device: frr
  devices.frr.clab.image: quay.io/frrouting/frr:10.7.1

nodes:
  r1:                                   # Module daemons (always includes zebra)
    module: [ ospf, bgp ]
    bgp.as: 65000
  r2:                                   # Extra daemons, deduplicated
    module: [ ospf, bgp ]
    bgp.as: 65000
    frr.daemons: [ pimd, bgpd ]
  r3:                                   # All daemons -- no 'daemons' list
    frr.daemons: True
  r4: {}                                # No routing protocols -- only zebra
links: [ r1-r2, r2-r3, r3-r4 ]
