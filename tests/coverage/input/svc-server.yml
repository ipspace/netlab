message: |
  Check server resolution in services module

defaults:
  device: none
  devices.none.features.services.server.dns: True

provider: clab

module: [ services ]

services.dns.server: [ dns_s1, dns_s2 ]

nodes:
  dns_c1:
  dns_c2:
  dns_s1:
    services.server.dns: True
  dns_s2:
    services.server.dns: True
    loopback: False

links:
- dns_c1:
    ipv6: False
  dns_c2:
  dns_s1:
  dns_s2:
  prefix:
    ipv4: 172.16.0.0/24
    ipv6: 2001:db8::/64
