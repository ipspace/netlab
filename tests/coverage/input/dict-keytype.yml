#
# This code coverage topology tests the _keytype validation: dictionary keys can be validated with
# a dictionary (for example, with a valid_values constraint) or with a user-defined custom type
#
defaults:
  device: none
  attributes:
    bgp_session_type:                     # Custom type used as a _keytype
      type: str
      valid_values: [ ibgp, ebgp ]
    node:
      community:                          # _keytype defined as a dictionary
        type: dict
        _keytype:
          type: str
          valid_values: [ ibgp, ebgp ]
        _subtype: list
      sessions:                           # _keytype defined as a custom type
        type: dict
        _keytype: bgp_session_type
        _subtype: list

module: [ bgp ]
bgp.as: 65000

nodes:
  a:
    community:
      ibgp: [ standard ]
      ebgp: [ extended ]
    sessions:
      ibgp: [ standard, extended ]
