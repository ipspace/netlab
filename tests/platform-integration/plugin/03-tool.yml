message: |
  The test checks how netlab adds tool plugins (the 'plugin' attribute of
  a tool definition) to the list of lab plugins. The integration harness
  creates the test script, the scratch topologies, and dummy plugins, and
  runs the test script as the validation step.
  To run the test by hand, use:

  netlab create -o none 03-tool.yml && bash plugin-tool/test.sh

plugin: [ files ]
defaults.device: linux

defaults.netlab.integration:
  skip: [ up, initial ]                       # There is no lab to start or configure
  validate: bash plugin-tool/test.sh          # Run the test script created by the 'files' plugin

nodes: [ x ]

_dummy: &dummy |
  # Dummy plugin used to check whether netlab loaded the plugin

#
# Dummy plugins, common defaults (used instead of user defaults), and
# self-contained scratch topologies (one per test)
#
files:
  plugin-tool/p_list.py: *dummy
  plugin-tool/p_str.py: *dummy
  plugin-tool/p_enabled.py: *dummy
  plugin-tool/p_other.py: *dummy
  plugin-tool/defaults.yml: |
    device: none
    provider: clab
    tools:
      t_list:
        plugin: [ p_list ]
        runtime: docker
        docker.up: 'true'
      t_str:
        plugin: p_str
        runtime: docker
        docker.up: 'true'
      t_enabled:
        plugin: [ p_enabled ]
        enabled: True
        runtime: docker
        docker.up: 'true'
  plugin-tool/none.yml: |
    defaults.tools.t_enabled.enabled: False
    nodes: [ r1 ]
  plugin-tool/list.yml: |
    defaults.tools.t_enabled.enabled: False
    tools.t_list: {}
    nodes: [ r1 ]
  plugin-tool/str.yml: |
    defaults.tools.t_enabled.enabled: False
    tools.t_str: {}
    nodes: [ r1 ]
  plugin-tool/enabled.yml: |
    tools.t_list: {}
    nodes: [ r1 ]
  plugin-tool/off.yml: |
    tools:
      t_list.plugin: []
      t_enabled.plugin: []
    nodes: [ r1 ]
  plugin-tool/other.yml: |
    defaults.tools.t_enabled.enabled: False
    tools.t_list.plugin: p_other
    nodes: [ r1 ]
  plugin-tool/topo_dict.yml: |
    defaults.tools.t_enabled.enabled: False
    plugin:
      p_other: True
    tools.t_str: {}
    nodes: [ r1 ]
  plugin-tool/test.sh: |
    #!/bin/bash
    #
    # Run 'netlab create' on topologies using tools with plugins and check
    # the resulting plugin list
    #
    cd "$(dirname "$0")"
    unset $(env | grep -o '^NETLAB_[A-Za-z0-9_]*')    # Do not use NETLAB_ variables from the user environment
    export LC_ALL=C                                   # Stable sort order of plugin names
    err_cnt=0

    # Transform a scratch topology. The common defaults replace the user defaults
    create() {
      local topo="$1"
      shift
      netlab create --defaults defaults.yml -o pickle "$@" "$topo.yml" 2>&1
    }

    # Get the sorted list of plugins from the transformed topology. 'netlab inspect'
    # fails when the 'plugin' attribute is missing (no plugins); any other failure
    # is an error
    plugins() {
      local output
      if output=$(netlab inspect plugin 2>&1); then
        echo "$output" | sed -n 's/^- *\([^ ]*\).*/\1/p' | sort | paste -sd, -
      elif echo "$output" | grep -q "name 'plugin' is not defined"; then
        echo ""
      else
        echo "$output"
        return 1
      fi
    }

    # Report a failed test, indenting the extra information
    failed() {
      echo "FAILED: $1"
      [ -n "$2" ] && echo "$2" | sed 's/^/        /'
      err_cnt=$((err_cnt + 1))
    }

    # check <description> <expected plugins> <topology> [<netlab create args>]
    # Use VAR=value check ... to set environment variables
    check() {
      local desc="$1" expected="$2" output result
      shift 2
      rm -f netlab.snapshot.pickle                    # Never inspect a stale snapshot
      if ! output=$(create "$@"); then
        failed "$desc (netlab create failed)" "$output"
      elif ! result=$(plugins); then
        failed "$desc (netlab inspect failed)" "$result"
      elif [ "$result" == "$expected" ]; then
        echo "OK:     $desc"
      else
        failed "$desc" "expected: $expected"$'\n'"got:      $result"
      fi
    }

    check "No plugins of inactive tools" "" none
    check "Tool plugins (list)" "p_list" list
    check "Tool plugin specified as a string" "p_str" str
    check "Plugins of tools enabled by default" "p_enabled,p_list" enabled
    check "Users can disable tool plugins" "" off
    check "Lab topology can change tool plugins" "p_other" other
    check "Tool plugins are added to topology plugins" "p_other,p_str" topo_dict

    NETLAB_TOOLS_T__STR_ENABLED=True \
      check "Tool enabled with an environment variable" "p_str" none

    rm -f netlab.snapshot.pickle
    if [ "$err_cnt" -ne 0 ]; then
      echo "Found $err_cnt errors"
    fi
    exit $err_cnt
