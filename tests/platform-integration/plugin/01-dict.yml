message: |
  The test checks how netlab merges lists and dictionaries of plugins
  specified in the lab topology, topology defaults, environment variables,
  and CLI arguments. The integration harness creates the test script, the
  scratch topologies, and dummy plugins, and runs the test script as the
  validation step.
  To run the test by hand, use:

  netlab create -o none 01-dict.yml && bash plugin-dict/test.sh

plugin: [ files ]
defaults.device: linux

defaults.netlab.integration:
  skip: [ up, initial ]                       # There is no lab to start or configure
  validate: bash plugin-dict/test.sh          # Run the test script created by the 'files' plugin

nodes: [ x ]

_dummy: &dummy |
  # Dummy plugin used to check whether netlab loaded the plugin

#
# Dummy plugins, common defaults (used instead of user defaults), and
# self-contained scratch topologies (one per test)
#
files:
  plugin-dict/p_a.py: *dummy
  plugin-dict/x.b/plugin.py: *dummy
  plugin-dict/y.c/plugin.py: *dummy
  plugin-dict/defaults.yml: |
    device: none
    provider: clab
  plugin-dict/none.yml: |
    nodes: [ r1 ]
  plugin-dict/list.yml: |
    plugin: [ p_a ]
    nodes: [ r1 ]
  plugin-dict/dict.yml: |
    plugin:
      p_a: True
      x.b: True
      y.c: False
    nodes: [ r1 ]
  plugin-dict/nested.yml: |
    plugin:
      y:
        c: True
    nodes: [ r1 ]
  plugin-dict/d_list.yml: |
    defaults.plugin: [ p_a ]
    nodes: [ r1 ]
  plugin-dict/d_dict.yml: |
    defaults.plugin:
      p_a: True
      x.b: False
    nodes: [ r1 ]
  plugin-dict/test.sh: |
    #!/bin/bash
    #
    # Run 'netlab create' with various combinations of plugin lists/dictionaries,
    # environment variables, and CLI arguments, and check the resulting plugin list
    #
    cd "$(dirname "$0")"
    unset $(env | grep -o '^NETLAB_[A-Za-z0-9_]*')    # Do not use NETLAB_ variables from the user environment
    export LC_ALL=C                                   # Stable sort order of plugin names
    err_cnt=0

    # Transform a scratch topology. The common defaults replace the user defaults
    create() {
      local topo="$1"
      shift
      netlab create --defaults defaults.yml -o pickle "$@" "$topo.yml" 2>&1
    }

    # Get the sorted list of plugins from the transformed topology. 'netlab inspect'
    # fails when the 'plugin' attribute is missing (no plugins); any other failure
    # is an error
    plugins() {
      local output
      if output=$(netlab inspect plugin 2>&1); then
        echo "$output" | sed -n 's/^- *\([^ ]*\).*/\1/p' | sort | paste -sd, -
      elif echo "$output" | grep -q "name 'plugin' is not defined"; then
        echo ""
      else
        echo "$output"
        return 1
      fi
    }

    # Report a failed test, indenting the extra information
    failed() {
      echo "FAILED: $1"
      [ -n "$2" ] && echo "$2" | sed 's/^/        /'
      err_cnt=$((err_cnt + 1))
    }

    # check <description> <expected plugins> <topology> [<netlab create args>]
    # Use VAR=value check ... to set environment variables
    check() {
      local desc="$1" expected="$2" output result
      shift 2
      rm -f netlab.snapshot.pickle                    # Never inspect a stale snapshot
      if ! output=$(create "$@"); then
        failed "$desc (netlab create failed)" "$output"
      elif ! result=$(plugins); then
        failed "$desc (netlab inspect failed)" "$result"
      elif [ "$result" == "$expected" ]; then
        echo "OK:     $desc"
      else
        failed "$desc" "expected: $expected"$'\n'"got:      $result"
      fi
    }

    # fail <description> <error message pattern> <topology> [<netlab create args>]
    # Check that 'netlab create' fails with the expected error message
    fail() {
      local desc="$1" pattern="$2" output
      shift 2
      if output=$(create "$@"); then
        failed "$desc (netlab create did not fail)"
      elif echo "$output" | grep -q "$pattern"; then
        echo "OK:     $desc"
      else
        failed "$desc (unexpected error message)" "$output"
      fi
    }

    check "List of plugins" "p_a" list
    check "Dictionary of plugins (False values are skipped)" "p_a,x.b" dict
    check "Nested dictionary of plugins" "y.c" nested
    check "Default plugins (list)" "p_a" d_list
    check "Default plugins (dictionary)" "p_a" d_dict

    NETLAB_PLUGIN=p_a \
      check "Environment variable: list of default plugins" "p_a" none
    NETLAB_PLUGIN_X_B=True \
      check "Environment variable: dotted plugin name" "x.b" none
    NETLAB_PLUGIN_X_B=True \
      check "Environment variable + topology list" "p_a,x.b" list
    NETLAB_PLUGIN_X_B=True \
      check "Environment variable overrides a False default" "p_a,x.b" d_dict

    check "CLI setting adds a plugin to a dictionary" "p_a,x.b,y.c" dict -s plugin.y.c=True
    check "CLI setting removes a plugin from a dictionary" "x.b" dict -s plugin.p_a=False
    check "CLI setting creates a dictionary" "x.b" none -s plugin.x.b=True
    check "CLI --plugin + topology dictionary" "p_a,x.b,y.c" dict --plugin y.c
    check "CLI --plugin + CLI setting" "p_a,x.b" none --plugin p_a -s plugin.x.b=True

    fail "CLI setting cannot extend a topology list" "Cannot set topology value plugin" \
      list -s plugin.x.b=True
    NETLAB_PLUGIN_X_B=True \
      fail "Environment variable cannot extend a list of default plugins" "Cannot set defaults.plugin" d_list

    rm -f netlab.snapshot.pickle
    if [ "$err_cnt" -ne 0 ]; then
      echo "Found $err_cnt errors"
    fi
    exit $err_cnt
