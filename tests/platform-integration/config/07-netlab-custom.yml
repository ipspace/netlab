provider: clab

plugin: [ files ]

nodes:
  e1:
    device: eos
    netlab_config_mode: netmiko
  e2:
    device: eos
    netlab_config_mode: sh
  e3:
    device: eos
    netlab_config_mode:
  f1:
    device: frr
    netlab_config_mode: sh
  f2:
    device: frr
    netlab_config_mode:
  f3:
    device: frr
    provider: libvirt
    netlab_config_mode: cp_sh
  f4:
    device: frr
    provider: libvirt
    netlab_config_mode:

links: [ e1-e2-e3-f1-f2-f3-f4 ]

files:
  noshut.j2: |
    interface {{ interfaces[0].ifname }}
      no shutdown
  failure.j2: |
    interface {{ interfaces[0].ifname }}
      wrong
