# A named prefix allocation policy must override the policy of its source pool

defaults.device: none

addressing:
  core:
    ipv4: 10.100.0.0/16
    prefix: 24
    allocation: sequential

prefix:
  named:
    pool: core
    allocation: id_based

nodes:
  r1:
    id: 10
  r2:
    id: 20

links:
- interfaces: [ r1, r2 ]
  prefix: named
