#
# BGP local role (RFC 9234) plugin topology test
#
plugin: [ bgp.local_role ]
module: [ bgp ]

defaults.device: frr
provider: clab

nodes:
  isp:
    bgp.as: 65001
  customer:
    bgp.as: 65002
  peer:
    bgp.as: 65003

links:
- isp:
    bgp.local_role: provider
  customer:
    bgp.local_role: customer
- isp:
    bgp.local_role: peer
  peer:
    bgp.local_role: peer
