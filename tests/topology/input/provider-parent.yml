#
# A provider with the 'parent' attribute uses the device settings of the parent provider
# unless the device overrides them with settings for the child provider
#
defaults.providers.kube:
  parent: clab
  description: containerlab with an alternate runtime

defaults.devices.eos.kube.image: registry.example.com/ceos:4.34.1F
defaults.devices.eos.kube.node.env.KUBE: true
defaults.devices.eos.kube.node.env.CLAB_MGMT_VRF:   # Remove an inherited setting

provider: kube

nodes:
  r1:
    device: eos
  r2:
    device: frr
    module: [ services ]          # FRR supports the services module only with containerlab
  r3:
    device: csr

links:
- r1-r2
