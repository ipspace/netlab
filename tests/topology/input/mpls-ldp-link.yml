#
# Enable or disable LDP on individual links
#
# * LDP is enabled on all intra-AS links unless disabled with 'mpls.ldp: False'
# * LDP is disabled on inter-AS links unless enabled with 'mpls.ldp: True'
#
module: [ ospf, bgp, mpls ]

defaults.device: none

nodes:
  r1:
    bgp.as: 65000
  r2:
    bgp.as: 65000
  r3:
    bgp.as: 65000
  x1:
    bgp.as: 65001
  x2:
    bgp.as: 65001

links:
- r1-r2
- r2:
  r3:
  mpls.ldp: True
- r1:
    mpls.ldp: False
  r3:
- x1-x2
- r1-x1
- r2:
  x2:
  mpls.ldp: True
