---
defaults.sources.extra: [ ../warnings.yml ]
defaults.device: none
module: [ routing ]

prefix:
  s_pfx:
    ipv4: 192.168.0.0/24

addressing:
  lan_h2:
    ipv4: 192.168.0.0/16
    prefix: 24
    allocation: id_based

routing.acl:
  h1_filter:
  - action: permit
    protocol: icmp
    src.prefix: any
    dst.prefix: any
    description: test ACL
  - action: permit
    protocol: tcp
    src.prefix: s_pfx
    dst:
      ipv4: 10.0.0.1
      port_op: not_in
      port_range: { min: 80, max: 443 }
    description: Named prefix -> host (not in port range)
  - action: permit
    protocol: udp
    description: Permit all UDP

nodes:
  n1:

links:
- n1.routing.acl.in: h1_filter
