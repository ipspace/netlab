#
# BGP role (RFC 9234) plugin topology test
#
plugin: [ bgp.policy ]
module: [ bgp ]

defaults.device: frr
provider: clab

nodes:
  isp:
    bgp.as: 65001
  customer:
    bgp.as: 65002
  peer:
    bgp.as: 65003

links:
- isp:
    bgp.role: provider
  customer:
    bgp.role: customer
- isp:
    bgp.role: peer
  peer:
    bgp.role: peer
