_extra_module:
- routing
bgp:
  advertise_loopback: true
  community:
    ebgp:
    - standard
    ibgp:
    - standard
    - extended
  next_hop_self: true
groups:
  as65001:
    members:
    - isp
  as65002:
    members:
    - customer
  as65003:
    members:
    - peer
input:
- topology/input/bgp-role.yml
- package:topology-defaults.yml
links:
- _linkname: links[1]
  interfaces:
  - bgp:
      role:
        name: provider
        strict: true
    ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.2/30
    node: isp
  - bgp:
      role:
        name: customer
        strict: false
    ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.1/30
    node: customer
  linkindex: 1
  node_count: 2
  prefix:
    ipv4: 10.1.0.0/30
  role: external
  type: p2p
- _linkname: links[2]
  interfaces:
  - bgp:
      role:
        name: peer
        strict: false
    ifindex: 2
    ifname: eth2
    ipv4: 10.1.0.5/30
    node: isp
  - bgp:
      role:
        name: peer
        strict: false
    ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.6/30
    node: peer
  linkindex: 2
  node_count: 2
  prefix:
    ipv4: 10.1.0.4/30
  role: external
  type: p2p
module:
- routing
- bgp
name: input
nodes:
  customer:
    _node_config:
      bgp: /etc/config/02-bgp.sh:sh
      bgp@policy: /etc/config/03-bgp@policy.sh:sh
      initial: /etc/config/01-initial.sh:sh
    af:
      ipv4: true
    bgp:
      _session_clear:
      - 10.1.0.2
      advertise:
      - ipv4: 10.0.0.2/32
      advertise_loopback: true
      as: 65002
      community:
        ebgp:
        - standard
        - large
        ibgp:
        - standard
        - large
        - extended
        localas_ibgp:
        - standard
        - large
        - extended
      ipv4: true
      neighbors:
      - activate:
          ipv4: true
        as: 65001
        ifindex: 1
        ipv4: 10.1.0.2
        name: isp
        role:
          name: customer
          strict: false
        type: ebgp
      next_hop_self: true
      router_id: 10.0.0.2
    box: quay.io/frrouting/frr:10.6.1
    clab:
      binds:
      - source: node_files/customer/initial
        target: /etc/config/01-initial.sh
      - source: node_files/customer/bgp
        target: /etc/config/02-bgp.sh
      - source: node_files/customer/bgp.policy
        target: /etc/config/03-bgp@policy.sh
      - source: node_files/customer/daemons
        target: /etc/frr/daemons
      - mode: ro
        source: node_files/-shared-hosts
        target: /etc/hosts
      config_templates:
      - mode: sh
        source: initial
        target: /etc/config/01-initial.sh
      - mode: sh
        source: bgp
        target: /etc/config/02-bgp.sh
      - mode: sh
        source: bgp.policy
        target: /etc/config/03-bgp@policy.sh
      - source: daemons
        target: /etc/frr/daemons
      - mode: shared
        source: hosts
        target: /etc/hosts
      exec:
      - sleep 1
      kind: linux
    config:
    - bgp.policy
    device: frr
    hostname: clab-input-customer
    id: 2
    interfaces:
    - bgp:
        role:
          name: customer
          strict: false
      ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.1/30
      linkindex: 1
      mtu: 1500
      name: customer -> isp
      neighbors:
      - bgp:
          role:
            name: provider
            strict: true
        ifname: eth1
        ipv4: 10.1.0.2/30
        node: isp
      role: external
      type: p2p
    loopback:
      bgp:
        advertise: true
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.2/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.102
      mac: ca:fe:00:02:00:00
    module:
    - bgp
    mtu: 1500
    name: customer
    netlab_ansible_skip_module:
    - initial
    - bgp
    - bgp.policy
    role: router
  isp:
    _node_config:
      bgp: /etc/config/02-bgp.sh:sh
      bgp@policy: /etc/config/03-bgp@policy.sh:sh
      initial: /etc/config/01-initial.sh:sh
    af:
      ipv4: true
    bgp:
      _session_clear:
      - 10.1.0.1
      - 10.1.0.6
      advertise:
      - ipv4: 10.0.0.1/32
      advertise_loopback: true
      as: 65001
      community:
        ebgp:
        - standard
        - large
        ibgp:
        - standard
        - large
        - extended
        localas_ibgp:
        - standard
        - large
        - extended
      ipv4: true
      neighbors:
      - activate:
          ipv4: true
        as: 65002
        ifindex: 1
        ipv4: 10.1.0.1
        name: customer
        role:
          name: provider
          strict: true
        type: ebgp
      - activate:
          ipv4: true
        as: 65003
        ifindex: 2
        ipv4: 10.1.0.6
        name: peer
        role:
          name: peer
          strict: false
        type: ebgp
      next_hop_self: true
      router_id: 10.0.0.1
    box: quay.io/frrouting/frr:10.6.1
    clab:
      binds:
      - source: node_files/isp/initial
        target: /etc/config/01-initial.sh
      - source: node_files/isp/bgp
        target: /etc/config/02-bgp.sh
      - source: node_files/isp/bgp.policy
        target: /etc/config/03-bgp@policy.sh
      - source: node_files/isp/daemons
        target: /etc/frr/daemons
      - mode: ro
        source: node_files/-shared-hosts
        target: /etc/hosts
      config_templates:
      - mode: sh
        source: initial
        target: /etc/config/01-initial.sh
      - mode: sh
        source: bgp
        target: /etc/config/02-bgp.sh
      - mode: sh
        source: bgp.policy
        target: /etc/config/03-bgp@policy.sh
      - source: daemons
        target: /etc/frr/daemons
      - mode: shared
        source: hosts
        target: /etc/hosts
      exec:
      - sleep 1
      kind: linux
    config:
    - bgp.policy
    device: frr
    hostname: clab-input-isp
    id: 1
    interfaces:
    - bgp:
        role:
          name: provider
          strict: true
      ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.2/30
      linkindex: 1
      mtu: 1500
      name: isp -> customer
      neighbors:
      - bgp:
          role:
            name: customer
            strict: false
        ifname: eth1
        ipv4: 10.1.0.1/30
        node: customer
      role: external
      type: p2p
    - bgp:
        role:
          name: peer
          strict: false
      ifindex: 2
      ifname: eth2
      ipv4: 10.1.0.5/30
      linkindex: 2
      mtu: 1500
      name: isp -> peer
      neighbors:
      - bgp:
          role:
            name: peer
            strict: false
        ifname: eth1
        ipv4: 10.1.0.6/30
        node: peer
      role: external
      type: p2p
    loopback:
      bgp:
        advertise: true
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    module:
    - bgp
    mtu: 1500
    name: isp
    netlab_ansible_skip_module:
    - initial
    - bgp
    - bgp.policy
    role: router
  peer:
    _node_config:
      bgp: /etc/config/02-bgp.sh:sh
      bgp@policy: /etc/config/03-bgp@policy.sh:sh
      initial: /etc/config/01-initial.sh:sh
    af:
      ipv4: true
    bgp:
      _session_clear:
      - 10.1.0.5
      advertise:
      - ipv4: 10.0.0.3/32
      advertise_loopback: true
      as: 65003
      community:
        ebgp:
        - standard
        - large
        ibgp:
        - standard
        - large
        - extended
        localas_ibgp:
        - standard
        - large
        - extended
      ipv4: true
      neighbors:
      - activate:
          ipv4: true
        as: 65001
        ifindex: 1
        ipv4: 10.1.0.5
        name: isp
        role:
          name: peer
          strict: false
        type: ebgp
      next_hop_self: true
      router_id: 10.0.0.3
    box: quay.io/frrouting/frr:10.6.1
    clab:
      binds:
      - source: node_files/peer/initial
        target: /etc/config/01-initial.sh
      - source: node_files/peer/bgp
        target: /etc/config/02-bgp.sh
      - source: node_files/peer/bgp.policy
        target: /etc/config/03-bgp@policy.sh
      - source: node_files/peer/daemons
        target: /etc/frr/daemons
      - mode: ro
        source: node_files/-shared-hosts
        target: /etc/hosts
      config_templates:
      - mode: sh
        source: initial
        target: /etc/config/01-initial.sh
      - mode: sh
        source: bgp
        target: /etc/config/02-bgp.sh
      - mode: sh
        source: bgp.policy
        target: /etc/config/03-bgp@policy.sh
      - source: daemons
        target: /etc/frr/daemons
      - mode: shared
        source: hosts
        target: /etc/hosts
      exec:
      - sleep 1
      kind: linux
    config:
    - bgp.policy
    device: frr
    hostname: clab-input-peer
    id: 3
    interfaces:
    - bgp:
        role:
          name: peer
          strict: false
      ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.6/30
      linkindex: 2
      mtu: 1500
      name: peer -> isp
      neighbors:
      - bgp:
          role:
            name: peer
            strict: false
        ifname: eth2
        ipv4: 10.1.0.5/30
        node: isp
      role: external
      type: p2p
    loopback:
      bgp:
        advertise: true
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.3/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.103
      mac: ca:fe:00:03:00:00
    module:
    - bgp
    mtu: 1500
    name: peer
    netlab_ansible_skip_module:
    - initial
    - bgp
    - bgp.policy
    role: router
plugin:
- bgp.policy
prefix:
  any:
    ipv4: 0.0.0.0/0
    ipv6: ::/0
provider: clab
