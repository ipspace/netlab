input:
- topology/input/provider-module-support.yml
- package:topology-defaults.yml
module:
- services
name: input
nodes:
  r1:
    _node_config:
      initial: :netmiko
      services: :netmiko
    af:
      ipv4: true
    box: debian/bookworm64
    device: frr
    id: 1
    interfaces: []
    libvirt:
      cpu: 1
      memory: 1024
    loopback:
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    module:
    - services
    mtu: 1500
    name: r1
    netlab_ansible_skip_module:
    - initial
    - services
    role: router
    services:
      dns:
        domain: netlab.local
provider: libvirt
services:
  dns:
    domain: netlab.local
