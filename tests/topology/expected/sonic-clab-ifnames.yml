groups:
  netlab_no_reload:
    members:
    - s1
    - s2
input:
- topology/input/sonic-clab-ifnames.yml
- package:topology-defaults.yml
links:
- _linkname: links[1]
  interfaces:
  - ifindex: 0
    ifname: Ethernet0
    ipv4: 10.1.0.1/30
    node: s1
  - ifindex: 0
    ifname: Ethernet0
    ipv4: 10.1.0.2/30
    node: s2
  linkindex: 1
  node_count: 2
  prefix:
    ipv4: 10.1.0.0/30
  type: p2p
name: input
nodes:
  s1:
    _node_config:
      initial: /etc/config/01-initial.sh:sh
    af:
      ipv4: true
    box: docker-sonic-vs:latest
    clab:
      binds:
      - source: node_files/s1/initial
        target: /etc/config/01-initial.sh
      config_templates:
      - mode: sh
        source: initial
        target: /etc/config/01-initial.sh
      exec:
      - sleep 1
      kind: sonic-vs
    device: sonic
    hostname: clab-input-s1
    id: 1
    interfaces:
    - clab:
        name: eth1
      ifindex: 0
      ifname: Ethernet0
      ipv4: 10.1.0.1/30
      linkindex: 1
      mtu: 1500
      name: s1 -> s2
      neighbors:
      - ifname: Ethernet0
        ipv4: 10.1.0.2/30
        node: s2
      type: p2p
    loopback:
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    mtu: 1500
    name: s1
    netlab_ansible_skip_module:
    - initial
    role: router
  s2:
    _node_config:
      initial: /etc/config/01-initial.sh:sh
    af:
      ipv4: true
    box: docker-sonic-vs:latest
    clab:
      binds:
      - source: node_files/s2/initial
        target: /etc/config/01-initial.sh
      config_templates:
      - mode: sh
        source: initial
        target: /etc/config/01-initial.sh
      exec:
      - sleep 1
      kind: sonic-vs
    device: sonic
    hostname: clab-input-s2
    id: 2
    interfaces:
    - clab:
        name: eth1
      ifindex: 0
      ifname: Ethernet0
      ipv4: 10.1.0.2/30
      linkindex: 1
      mtu: 1500
      name: s2 -> s1
      neighbors:
      - ifname: Ethernet0
        ipv4: 10.1.0.1/30
        node: s1
      type: p2p
    loopback:
      ifindex: 0
      ifname: Loopback0
      ipv4: 10.0.0.2/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.102
      mac: ca:fe:00:02:00:00
    mtu: 1500
    name: s2
    netlab_ansible_skip_module:
    - initial
    role: router
provider: clab
