input:
- topology/input/clab-attributes.yml
- package:topology-defaults.yml
name: input
nodes:
  n:
    af:
      ipv4: true
    box: quay.io/frrouting/frr:10.0.1
    clab:
      binds:
      - source: node_files/n/daemons
        target: /etc/frr/daemons
      - mode: ro
        source: node_files/-shared-hosts
        target: /etc/hosts
      - source: node_files/n/resolv
        target: /etc/resolv.conf
      cmd: /bin/bash
      config_templates:
      - source: daemons
        target: /etc/frr/daemons
      - mode: shared
        source: hosts
        target: /etc/hosts
      - source: resolv
        target: /etc/resolv.conf
      dns:
        search:
        - example.com
        servers:
        - 1.1.1.1
      env:
        FOO: BAR
      image: quay.io/frrouting/frr:9.1.0
      kind: frr
      license: license.txt
      ports: []
      srl-agents: []
      startup-config: start.cfg
      type: unknown
    device: frr
    hostname: mylab-input-n
    id: 1
    interfaces: []
    loopback:
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: ca:fe:00:01:00:00
    mtu: 1500
    name: n
    netlab_config_mode: false
    role: router
provider: clab
