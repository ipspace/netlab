---
message: |
  Test RFC 9234 provider/customer BGP roles on EBGP sessions.

plugin: [ bgp.local_role ]
module: [ bgp ]

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ customer, peer ]

defaults.bgp.as: 65000

nodes:
  dut:
    bgp.as: 65001
  customer:
    bgp.as: 65002
    loopback.ipv4: 172.16.2.1/32
  peer:
    bgp.as: 65003
    loopback.ipv4: 172.16.3.1/32

links:
- dut:
    bgp.local_role: provider
  customer:
    bgp.local_role: customer
- dut:
    bgp.local_role: peer
  peer:
    bgp.local_role: peer

validate:
  session_customer:
    description: Check provider/customer EBGP session
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ dut ]
    plugin: bgp_neighbor(node.bgp.neighbors,'customer')

  session_peer:
    description: Check peer/peer EBGP session
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ dut ]
    plugin: bgp_neighbor(node.bgp.neighbors,'peer')

  pfx_customer:
    description: Check that customer loopback is received on DUT
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ dut ]
    plugin: bgp_prefix(nodes.customer.loopback.ipv4)
