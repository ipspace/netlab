# A device has to support the following features to pass this test case:
#
# * Routed VLAN interfaces
# * VRFs
# * OSPF and OSPFv3 in VRFs
#
---
message: |
  VRF lite implementation with dual-stack VLAN trunks

  * h1, h2, and h5 should be able to ping each other using IPv4 and IPv6
  * h3 and h4 should be able to ping each other using IPv4 and IPv6

  Please note it might take a while for the lab to work due to
  STP, OSPF, and OSPFv3 setup phase

defaults.sources.extra: [ ../vrf/defaults-ipv6-only.yml, ../wait_times.yml, ../warnings.yml ]

groups:
  _auto_create: True
  routers:
    members: [ dut_a, r2, dut_b ]
    module: [ ospf, vrf, vlan ]
    role: router
  x_routers:
    members: [ r2 ]
    device: frr
    provider: clab
  hosts:
    members: [ h1, h2, h3, h4, h5 ]
    device: linux
    provider: clab

vrfs:
  red:
  blue:

vlans:
  red:
    mode: route
    vrf: red
    links: [ dut_a-h1, dut_b-h2, dut_a-h5 ]
  blue:
    mode: route
    vrf: blue
    links: [ dut_a-h3, dut_b-h4 ]

links:
- dut_a:
  r2:
  vlan.trunk: [ red, blue ]
- r2:
  dut_b:
  vlan.trunk: [ red, blue ]

validate:
  adj_dut_a_b:
    description: Check OSPF adjacencies VRF Blue (R2-DUT_A)
    wait_msg: Waiting for OSPF adjacencies to form
    wait: ospfv2_adj_stp
    nodes: [ r2 ]
    plugin: ospf_neighbor(nodes.dut_a.vrfs.blue.ospf.router_id,vrf='blue')
  adj_dut_a_r:
    description: Check OSPF adjacencies VRF Red (R2-DUT_B)
    wait_msg: Waiting for OSPF adjacencies to form
    wait: ospfv2_adj_lan
    nodes: [ r2 ]
    plugin: ospf_neighbor(nodes.dut_a.vrfs.red.ospf.router_id,vrf='red')
  adj_dut_b_b:
    description: Check OSPF adjacencies VRT Blue (R2-DUT_B)
    wait_msg: Waiting for OSPF adjacencies to form
    wait: ospfv2_adj_lan
    nodes: [ r2 ]
    plugin: ospf_neighbor(nodes.dut_b.vrfs.blue.ospf.router_id,vrf='blue')
  adj_v2_dut_a_r:
    description: Check OSPFv2 adjacencies VRF Red (R2-DUT_B)
    wait_msg: Waiting for OSPFv2 adjacencies to form
    wait: ospfv2_adj_lan
    nodes: [ r2 ]
    plugin: ospf_neighbor(nodes.dut_b.vrfs.red.ospf.router_id,vrf='red')
  adj_v3_dut_b_b:
    description: Check OSPFv3 adjacencies VRF Blue (R2-DUT_A)
    wait_msg: Waiting for OSPFv3 adjacencies to form
    wait: ospfv3_adj_stp
    nodes: [ r2 ]
    plugin: ospf6_neighbor(nodes.dut_a.vrfs.blue.ospf.router_id,vrf='blue')
  adj_v3_dut_a_r:
    description: Check OSPFv3 adjacencies VRF Red (R2-DUT_A)
    wait_msg: Waiting for OSPFv3 adjacencies to form
    wait: ospfv3_adj_lan
    nodes: [ r2 ]
    plugin: ospf6_neighbor(nodes.dut_a.vrfs.red.ospf.router_id,vrf='red')
  adj_v3_dut_b_b:
    description: Check OSPFv3 adjacencies VRF Blue (R2-DUT_B)
    wait_msg: Waiting for OSPFv3 adjacencies to form
    wait: ospfv3_adj_lan
    nodes: [ r2 ]
    plugin: ospf6_neighbor(nodes.dut_b.vrfs.blue.ospf.router_id,vrf='blue')
  adj_v3_dut_b_red:
    description: Check OSPFv3 adjacencies VRF Red (R2-DUT_B)
    wait_msg: Waiting for OSPFv3 adjacencies to form
    wait: ospfv3_adj_lan
    nodes: [ r2 ]
    plugin: ospf6_neighbor(nodes.dut_b.vrfs.red.ospf.router_id,vrf='red')
  red_v4:
    description: IPv4 intra-VLAN reachability (red)
    wait_msg: Waiting for STP forwarding state
    wait: ping_stp
    nodes: [ h1, h2 ]
    plugin: ping('h5',af='ipv4')
  red_v6:
    description: IPv6 intra-VLAN reachability (red)
    wait_msg: Waiting for STP forwarding state
    wait: ping_stp
    nodes: [ h1, h2 ]
    plugin: ping('h5',af='ipv6')
  blue_v4:
    description: IPv4 intra-VLAN reachability (blue)
    nodes: [ h3 ]
    wait: ping_long
    devices: [ linux ]
    plugin: ping('h4',af='ipv4')
  blue_v6:
    description: IPv6 intra-VLAN reachability (blue)
    nodes: [ h3 ]
    wait: ping_long
    devices: [ linux ]
    plugin: ping('h4',af='ipv6')
  filter_v4:
    description: IPv4 inter-VLAN isolation (red - blue)
    nodes: [ h1, h2 ]
    plugin: ping('h3',af='ipv4',expect='fail')
  filter_v6:
    description: IPv6 inter-VLAN isolation (red - blue)
    nodes: [ h1, h2 ]
    plugin: ping('h3',af='ipv6',expect='fail')
