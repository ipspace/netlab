---
message: |
  Test RFC 9234 BGP roles on EBGP sessions: provider/customer and peer/peer
  sessions (including route-leak prevention), and strict-mode role mismatch
  handling when another session on the same router has incompatible roles.

plugin: [ bgp.policy ]
module: [ bgp ]

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ customer, peer, upstream, bad, good ]

defaults.bgp.as: 65000

nodes:
  dut:
    bgp.as: 65001
  customer:
    bgp.as: 65002
    loopback.ipv4: 172.16.2.1/32
  peer:
    bgp.as: 65003
    loopback.ipv4: 172.16.3.1/32
  upstream:
    bgp.as: 65004
    loopback.ipv4: 172.16.4.1/32
  bad:
    bgp.as: 65199
  good:
    bgp.as: 65198
    loopback.ipv4: 172.16.98.1/32

links:
- dut:
    bgp.role: customer
  upstream:
    bgp.role: provider
- dut:
    bgp.role: provider
  customer:
    bgp.role: customer
- dut:
    bgp.role: peer
  peer:
    bgp.role: peer
- dut:
    bgp.role:
      name: provider
      strict: true
  bad:
    bgp.role:
      name: peer
      strict: true
- dut:
    bgp.role:
      name: provider
      strict: true
  good:
    bgp.role:
      name: customer
      strict: true

validate:
  session_upstream:
    description: Check provider/customer EBGP session toward upstream (FRR probe to DUT)
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ upstream ]
    devices: [ frr ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')

  session_customer:
    description: Check provider/customer EBGP session toward customer (FRR probe to DUT)
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ customer ]
    devices: [ frr ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')

  session_peer:
    description: Check peer/peer EBGP session (FRR probe to DUT)
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ peer ]
    devices: [ frr ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')

  session_good:
    description: Check that the provider/customer strict-mode session is established
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ good ]
    devices: [ frr ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')

  wait:
    description: Wait a few seconds before checking the mismatched session
    wait: 5

  session_bad:
    description: Check that incompatible strict-mode roles prevent session establishment
    nodes: [ bad ]
    devices: [ frr ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut',state=['Idle','Active'])

  pfx_upstream:
    description: Check that upstream advertises its loopback
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ upstream ]
    devices: [ frr ]
    plugin: bgp_prefix(nodes.upstream.loopback.ipv4)

  pfx_customer:
    description: Check that customer advertises its loopback
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ customer ]
    devices: [ frr ]
    plugin: bgp_prefix(nodes.customer.loopback.ipv4)

  pfx_peer:
    description: Check that peer advertises its loopback
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ peer ]
    devices: [ frr ]
    plugin: bgp_prefix(nodes.peer.loopback.ipv4)

  pfx_no_leak:
    description: Check that upstream prefix is not leaked to the peer session
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ peer ]
    devices: [ frr ]
    plugin: bgp_prefix(nodes.upstream.loopback.ipv4,state='missing')

  pfx_good:
    description: Check that good advertises its loopback
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ good ]
    devices: [ frr ]
    plugin: bgp_prefix(nodes.good.loopback.ipv4)
