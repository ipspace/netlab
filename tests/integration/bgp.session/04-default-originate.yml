message:
  This lab tests the BGP default route origination. The DUT should advertise a
  default route to X1.

plugin: [ bgp.session, test.vrf_check ]
module: [ bgp ]

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ x1, x2, r1, r2 ]

defaults.bgp.as: 65000
bgp.advertise_loopback: false

addressing:
  p2p:
    ipv6: 2001:db8:3::/48
  lan:
    ipv6: 2001:db8:4::/48

vrfs:
  tenant:

nodes:
  dut:
    module: [ bgp, vrf ]
    role: router
  x1:                         # Global default route
    bgp.as: 65100
    bgp.advertise_loopback: True
    loopback:
      ipv4: 172.17.0.1/32
      ipv6: 2001:db8:cafe::1/128
  x2:                         # VRF default route
    bgp.as: 65200
    bgp.advertise_loopback: True
    loopback:
      ipv4: 172.17.0.2/32
      ipv6: 2001:db8:cafe::2/128
  r1:                         # No default route, global
    bgp.as: 65101
  r2:                         # No default route, VRF
    bgp.as: 65102

links:
- dut:
    bgp.default_originate: true
  x1:
- dut:
    bgp.default_originate: true
    vrf: tenant
  x2:
- dut-r1
- dut:
    vrf: tenant
  r2:

validate:
  ebgp_v4:
    description: Check IPv4 EBGP sessions with DUT
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ x1, r1 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')
  ebgp_v6:
    description: Check IPv6 EBGP sessions with DUT
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ x1, r1 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut',af='ipv6')
  def_ipv4:
    description: Check whether DUT advertises IPv4 default route to X1
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ x1 ]
    plugin: bgp_prefix('0.0.0.0/0')
  def_ipv6:
    description: Check whether DUT advertises IPv6 default route to X1
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ x1 ]
    plugin: bgp_prefix('::/0',af='ipv6')
  prop_ipv4:
    description: Check the propagation of IPv4 routes X1 -> R1
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r1 ]
    plugin: bgp_prefix(nodes.x1.loopback.ipv4)
  prop_ipv6:
    description: Check the propagation of IPv6 routes X1 -> R1
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r1 ]
    plugin: bgp_prefix(nodes.x1.loopback.ipv6,af='ipv6')
  nd_ipv4:
    description: Check whether DUT advertises IPv4 default route to R1
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r1 ]
    plugin: bgp_prefix('0.0.0.0/0',state='missing')
  nd_ipv6:
    description: Check whether DUT advertises IPv6 default route to R1
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r1 ]
    plugin: bgp_prefix('::/0',af='ipv6',state='missing')

  vrf_ebgp_v4:
    description: Check IPv4 EBGP sessions with DUT VRF
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ x2, r2 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')
  vrf_ebgp_v6:
    description: Check IPv6 EBGP sessions with DUT VRF
    wait_msg: Waiting for EBGP session establishment
    wait: ebgp_session
    nodes: [ x2, r2 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut',af='ipv6')
  vrf_def_ipv4:
    description: Check whether DUT advertises VRF IPv4 default route to X2
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ x2 ]
    plugin: bgp_prefix('0.0.0.0/0')
  vrf_def_ipv6:
    description: Check whether DUT advertises VRF IPv6 default route to X2
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ x2 ]
    plugin: bgp_prefix('::/0',af='ipv6')
  vrf_prop_ipv4:
    description: Check the propagation of IPv4 routes X2 -> R2
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r2 ]
    plugin: bgp_prefix(nodes.x2.loopback.ipv4)
  vrf_prop_ipv6:
    description: Check the propagation of IPv6 routes X2 -> R2
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r2 ]
    plugin: bgp_prefix(nodes.x2.loopback.ipv6,af='ipv6')
  vrf_nd_ipv4:
    description: Check whether DUT advertises VRF IPv4 default route to R2
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r2 ]
    plugin: bgp_prefix('0.0.0.0/0',state='missing')
  vrf_nd_ipv6:
    description: Check whether DUT advertises VRF IPv6 default route to R2
    wait: bgp_scan_time
    wait_msg: Waiting for BGP convergence
    nodes: [ r2 ]
    plugin: bgp_prefix('::/0',af='ipv6',state='missing')
