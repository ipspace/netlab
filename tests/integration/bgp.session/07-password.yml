message:
  This lab tests the BGP MD5 password functionality. The EBGP session
  between the probe and the DUT should be established.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

plugin: [ bgp.session, test.vrf_check ]
module: [ bgp, vrf ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ x1, v1 ]
    module: [ bgp ]

vrfs:
  tenant:

addressing:
  p2p:
    ipv6: 2001:db8:3::/48
  lan:
    ipv6: 2001:db8:4::/48

defaults.bgp.as: 65000

nodes:
  dut:
  x1:
    bgp.as: 65100
  v1:
    bgp.as: 65101

links:
- dut:
  x1:
  bgp.password: Secret
- dut:
  v1:
  bgp.password: Other
  vrf: tenant

validate:
  session_v4:
    description: Check IPv4 EBGP sessions with DUT
    wait_msg: Waiting for EBGP session establishment
    wait: 200
    nodes: [ x1, v1 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')
  session_v6:
    description: Check IPv6 EBGP sessions with DUT
    wait_msg: Waiting for EBGP session establishment
    wait: 30
    nodes: [ x1, v1 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut',af='ipv6')
