message: |
  This topology tests the OSPFv2 with BFD

  * Multiple OSPF areas on ABR
  * BFD enabled on all interfaces

defaults.sources.extra: [ ../../wait_times.yml, ../../warnings.yml ]
module: [ ospf, bfd ]

ospf.bfd.ipv4: True

nodes:
  bb:
    ospf.router_id: 10.42.42.1
  abr:
  r1:
    ospf.area: 1

links:
- bb-abr
- abr:
  r1:
  ospf:
    area: 1
    cost: 42
    network_type: broadcast
- abr:

validate:
  adj:
    description: Check OSPF adjacencies
    wait: ospfv2_adj_p2p
    wait_msg: Waiting for OSPF adjacency process to complete
    nodes: [ r1, bb ]
    plugin: ospf_neighbor(nodes.abr.ospf.router_id)
  bfd:
    description: Check OSPF BFD adjacencies
    wait: ospfv2_adj_p2p
    wait_msg: Waiting for OSPF BFD adjacency process to complete
    nodes: [ r1,bb ]
    plugin: ospf_neighbor(nodes.abr.ospf.router_id,bfd=True)
