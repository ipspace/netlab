message: |
  This topology tests the OSPFv3 with BFD

  * Multiple OSPF areas on ABR
  * BFD enabled on all interfaces

addressing:
  loopback:
    ipv4: False
    ipv6: 2001:db8:1::/48
  lan:
    ipv4: False
    ipv6: 2001:db8:2::/48
  p2p:
    ipv4: False
    ipv6: 2001:db8:3::/48

defaults.sources.extra: [ ../../wait_times.yml, ../../warnings.yml ]
module: [ ospf, bfd ]

ospf.bfd.ipv6: True

nodes:
  bb:
    ospf.router_id: 10.42.42.1
  abr:
  r1:
    ospf.area: 1

links:
- bb-abr
- abr:
  r1:
  ospf:
    area: 1
    cost: 42
    network_type: broadcast
- abr:

validate:
  adj:
    description: Check OSPF adjacencies
    wait: ospfv3_adj_p2p
    wait_msg: Waiting for OSPF adjacency process to complete
    nodes: [ r1, bb ]
    plugin: ospf6_neighbor(nodes.abr.ospf.router_id)
  bfd:
    description: Check OSPF adjacencies
    wait: ospfv3_adj_p2p
    wait_msg: Waiting for OSPF adjacency process to complete
    nodes: [ r1, bb ]
    plugin: ospf6_neighbor(nodes.abr.ospf.router_id,bfd=True)
