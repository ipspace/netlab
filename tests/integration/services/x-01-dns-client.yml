message: |
  Configure the DNS client (cannot be meaningfully tested)

nodes:
  dut:
    module: [ services ]
    services.dns.server: dnssrv
  dnssrv:
    device: dnsmasq
    provider: clab
    services.server.dns.forwarder.ipv4: 8.8.8.8
  t1:
    device: linux
    provider: clab

links: [ dut-dnssrv-t1 ]
