# SONiC ospf.areas plugin: s1 is an ABR (loopback area 0 + link area 1
# stub); s2 is a pure stub-area router. FRR-delegated.
provider: clab
plugin: [ multilab, ospf.areas ]
defaults:
  device: sonic_clab
  multilab:
    id: 52
module: [ ospf ]
nodes:
  s1:
    ospf.areas: [ { area: 0.0.0.1, kind: stub } ]
  s2:
    ospf.areas: [ { area: 0.0.0.1, kind: stub } ]
links:
- s1:
    ospf.area: 0.0.0.0
  type: stub
- s1:
  s2:
  ospf.area: 0.0.0.1
