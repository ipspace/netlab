# SONiC per-VRF OSPFv3: dual-stack version of the VRF test (link in VRF
# red with per-VRF OSPF). Needs features.vrf.ospfv3 (declared on the sonic_clab device) --
# the shared vrf/frr.frr-config.j2 already renders `router ospf6 vrf <name>` once the
# feature flag unlocks it and the VRF has an ipv6 AF.
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64

module: [ vrf, ospf ]
vrfs:
  red:
nodes: [ s1, s2 ]
links:
- s1:
  s2:
  vrf: red
