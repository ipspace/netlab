# SONiC EVPN symmetric-IRB (L3VNI inter-subnet) spike.
# Two subnets (red, blue) in tenant VRF, stretched via VXLAN with
# an L3VNI. h1 (behind s1, subnet red) and h2 (behind s2, subnet blue) are in DIFFERENT
# subnets -- inter-subnet ping can only work through the L3VNI routing across the
# fabric, which is the symmetric-IRB datapath proof.
#
# docker-sonic-vs's orchagent bypassed as usual (kernel/FRR path, see
# templates/vxlan/sonic.j2 + templates/vlan/sonic.j2 for the create-before-address
# vrf-enslavement ordering this needed).
#   python validate/sonic.py --module evpn_irb
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52

module: [ vlan, vrf, ospf, bgp, vxlan, evpn ]
bgp.as: 65000

vrfs:
  tenant:
    evpn.transit_vni: 10099

vlans:
  red:
    mode: irb
    vrf: tenant
    vni: 10010
  blue:
    mode: irb
    vrf: tenant
    vni: 10020

nodes:
  s1:
  s2:
  h1:
    device: linux
  h2:
    device: linux

links:
- s1-s2
- s1:
    vlan.access: red
  h1:
- s2:
    vlan.access: blue
  h2:
