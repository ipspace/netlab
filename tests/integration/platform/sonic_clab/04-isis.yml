# 2-node SONiC IS-IS spike.
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52
module: [ isis ]
nodes: [ s1, s2 ]
links:
- s1:
  s2:

# native docker-exec validation (reuses FRR isis validation plugin via sonic_clab alias)
defaults.const.validate.isis_adj: 60
validate:
  adj_s1:
    description: s1 sees s2 as an IS-IS neighbor (docker-exec validation)
    wait_msg: Waiting for IS-IS adjacency
    wait: isis_adj
    nodes: [ s1 ]
    plugin: isis_neighbor("s2")
  adj_s2:
    description: s2 sees s1 as an IS-IS neighbor
    nodes: [ s2 ]
    plugin: isis_neighbor("s1")
