# SONiC OSPFv3 (dual-stack): FRR's ospf6d is already enabled by the deploy for every
# topology (ospfd/ospf6d/isisd all get flipped on in /etc/frr/daemons); the core `ospf` module
# template renders OSPFv3 automatically whenever ospf.af.ipv6 is set, which netlab derives from
# IPv6 addressing being present. Same 2-node p2p shape as the plain OSPF test, just dual-stack.
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64

module: [ ospf ]

nodes: [ s1, s2 ]

links:
- s1:
  s2:
