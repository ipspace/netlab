# SONiC files-plugin escape hatch worked example.
# BGP maximum-prefix-limit is a genuine netlab-CORE model
# gap (not device-specific): no netlab BGP module or plugin exposes a max-prefix
# attribute (defaults.yml bgp.session attr list has no such leaf) on ANY device, but
# FRR (and therefore SONiC, since SONiC routing IS FRR) supports it natively via plain
# vtysh CLI. This topology uses the `files` plugin's inline `configlets` + a node
# `config:` reference to inject the raw FRR config with ZERO external files -- the
# whole vendor-proprietary (here: FRR-native, still model-gap) config lives in this one
# topology YAML, same escape-hatch pattern as the ArcOS example.
#
# Mechanism check: the files plugin materializes the configlet as a real
# `bgp-maxprefix.j2` file in the topology directory at `netlab create` time; node
# `config: [ bgp-maxprefix ]` triggers netlab-core's stock "Deploy custom deployment
# templates" play, which resolves its deploy TASK the same way modules do
# (paths_deploy.tasks_generic) -- so it lands on our OWN tasks/deploy-config/sonic.yml
# override (docker exec + vtysh -f), the same mechanism already proven for
# tunnel.gre/evpn.multihoming plugin configs. No SONiC-specific plumbing needed.
#   python validate/sonic.py --module files_maxprefix
provider: clab
plugin: [ multilab, files ]
defaults:
  device: sonic_clab
  multilab:
    id: 52
module: [ bgp ]
nodes:
  s1:
    bgp.as: 65001
    config: [ bgp-maxprefix ]
  s2:
    bgp.as: 65002
links:
- s1:
  s2:

configlets:
  bgp-maxprefix: |
    router bgp {{ bgp.as }}
     address-family ipv4 unicast
    {% for n in bgp.neighbors|default([]) if n.ipv4 is defined %}
      neighbor {{ n.ipv4 }} maximum-prefix 100
    {% endfor %}
     exit-address-family
    !
