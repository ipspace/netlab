# SONiC VRF route-leaking: on s1, VRF blue imports VRF red
# RTs -> reds stub prefix appears in blues RIB (FRR rt vpn import, intra-node
# control-plane leak, independent of the VS dataplane).
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52
module: [ vrf, bgp ]
bgp.as: 65000
vrfs:
  red:
  blue:
    import: [ red, blue ]
nodes: [ s1, s2 ]
links:
- s1-s2
- s1:
  vrf: red
  type: stub
- s1:
  vrf: blue
  type: stub
