# 2-node SONiC (clab) OSPF smoke test.
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52
module: [ ospf ]
nodes: [ s1, s2 ]
links:
- s1:
  s2:

# native docker-exec validation (reuses FRR validation plugins via netsim/validate/*/sonic_clab.py)
defaults.const.validate.ospfv2_adj_lan: 60
defaults.const.validate.ospfv2_spf: 10
validate:
  adj_s1:
    description: s1 sees s2 as an OSPF neighbor (docker-exec validation)
    wait_msg: Waiting for OSPF adjacency
    wait: ospfv2_adj_lan
    nodes: [ s1 ]
    plugin: ospf_neighbor(nodes.s2.ospf.router_id)
  adj_s2:
    description: s2 sees s1 as an OSPF neighbor
    wait: ospfv2_spf
    nodes: [ s2 ]
    plugin: ospf_neighbor(nodes.s1.ospf.router_id)
