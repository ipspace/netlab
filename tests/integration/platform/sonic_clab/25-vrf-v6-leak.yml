# SONiC VRF IPv6 + v6 route-leaking: dual-stack version of the VRF route-leaking test.
# On s1, VRF blue imports VRF red's route-targets -> red's IPv6 stub
# prefix should appear in blue's v6 RIB (FRR rt vpn import, intra-node control-plane leak,
# independent of the VS dataplane -- same class as the v4 leak test).
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64
  lan:
    ipv6: 2001:db8:1::/48
    prefix6: 64

module: [ vrf, bgp ]
bgp.as: 65000
vrfs:
  red:
  blue:
    import: [ red, blue ]
nodes: [ s1, s2 ]
links:
- s1-s2
- s1:
  vrf: red
  type: stub
- s1:
  vrf: blue
  type: stub
