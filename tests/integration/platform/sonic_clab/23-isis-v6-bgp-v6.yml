# SONiC IS-IS(v6) + iBGP(v6): dual-stack IGP + BGP AF, same 2-node p2p shape as the
# IPv4 IS-IS/BGP tests, just IPv6. isisd is already enabled by the deploy; FRR's isisd
# renders IPv6 reachability (multi-topology) as soon as ipv6 addressing is present. iBGP peers
# over the v6 loopbacks, activated in the ipv6 unicast AF alongside ipv4.
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64

module: [ isis, bgp ]
bgp.as: 65000

nodes: [ s1, s2 ]

links:
- s1:
  s2:
