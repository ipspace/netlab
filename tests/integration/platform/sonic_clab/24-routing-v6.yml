# SONiC IPv6 static routing + prefix-lists: dual-stack version of the static-route
# slice of the routing test. Verifies `ipv6 route` + `ipv6 prefix-list` actually
# render and install, not just that the Jinja has an {% if %} branch for them.
provider: clab
plugin: [ multilab ]
defaults:
  device: sonic_clab
  multilab:
    id: 52

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
  p2p:
    ipv6: 2001:db8:100::/48
    prefix6: 64

module: [ routing ]

groups:
  routers:
    members: [ s1, s2 ]
    routing:
      prefix:
        stub-net6:
        - ipv6: 2001:db8:143::/48
          min: 64
          max: 64

nodes:
  s1:
    routing.static:
    - ipv6: 2001:db8:143:42::/64
      nexthop:
        node: s2
  s2:
    routing.static:
    - ipv6: 2001:db8:143:41::/64
      nexthop:
        node: s1

links:
- s1:
  s2:
