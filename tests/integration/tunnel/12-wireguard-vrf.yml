---
message: |
  Test dual-stack WireGuard tunnels in a transport VRF. The tested device
  has a WireGuard tunnel in the transport VRF carrying both IPv4 and IPv6 and
  runs (global) OSPFv2 and OSPFv3 over it. The probe should receive the routes
  advertised from the remote device (DUT) and be able to ping its loopback
  over both address families.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

addressing:
  loopback:
    ipv6: 2001:db8:1::/48
  lan:
    ipv6: 2001:db8:2::/48
  p2p:
    ipv6: 2001:db8:3::/48

plugin: [ tunnel.wireguard ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ r2 ]
    module: [ ospf ]
  ce:
    members: [ dut ]
    module: [ ospf, vrf ]

vrfs:
  transport:

nodes:
  dut:
  r2:

links:
- ospf: False
  mtu: 1580
  dut:
    vrf: transport
  r2:
- dut:
    tunnel.private_key: dwdtCnMYpX08FsFyUbJmRd9ML4frwJkqsXf7pR25LCo=
    tunnel.public_key: hSDwCYkwp1R0i33ctD73Wg2/Og0mOBr066SpjqqbTmo=
    tunnel.vrf: transport
  r2:
    tunnel.private_key: XasIfmJKikt54X+Lg4AO5m87sSkmGLb9HC+LJ/+I4Os=
    tunnel.public_key: 3p7bfXt9wbTTW2HC7OQ1Nz+DQ8hbeGdNrfx+FG+IK08=
  tunnel.mode: wireguard
  mtu: 1500

validate:
  adj:
    description: Check OSPFv2 adjacency with DUT
    wait: ospfv2_adj_p2p
    wait_msg: Waiting for OSPF adjacency process to complete
    nodes: [ r2 ]
    plugin: ospf_neighbor(nodes.dut.ospf.router_id)
  adj6:
    description: Check OSPFv3 adjacency with DUT
    wait: ospfv3_adj_p2p
    wait_msg: Waiting for OSPFv3 adjacency process to complete
    nodes: [ r2 ]
    plugin: ospf6_neighbor(nodes.dut.ospf.router_id)
  pfx:
    description: Check for DUT IPv4 loopback prefix being propagated to R2
    wait: ospfv2_spf_long
    wait_msg: Waiting for SPF to do its magic
    nodes: [ r2 ]
    plugin: ospf_prefix(nodes.dut.loopback.ipv4)
  pfx6:
    description: Check for DUT IPv6 loopback prefix being propagated to R2
    wait: ospfv3_spf_long
    wait_msg: Waiting for SPF to do its magic
    nodes: [ r2 ]
    plugin: ospf6_prefix(nodes.dut.loopback.ipv6)
  ping:
    description: Check end-to-end IPv4 connectivity
    wait: ping
    wait_msg: Still waiting for SPF...
    nodes: [ r2 ]
    plugin: ping(nodes.dut.loopback.ipv4)
  ping6:
    description: Check end-to-end IPv6 connectivity
    wait: ping
    nodes: [ r2 ]
    plugin: ping(nodes.dut.loopback.ipv6,af='ipv6')
  mtu:
    description: Check a full 1500-byte packet traverses the tunnel (underlay MTU 1580)
    nodes: [ r2 ]
    plugin: ping(nodes.dut.loopback.ipv4,pkt_len=1500)
