---
message: |
  Test WireGuard tunnels over IPv6 transport. The two tested devices have a
  WireGuard tunnel and run OSPFv3 over it. The probe should receive an OSPF
  route advertised from the remote device (DUT_R1) and be able to ping its
  loopback.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

addressing:
  loopback:
    ipv4: False
    ipv6: 2001:db8:1::/48
  lan:
    ipv4: False
    ipv6: 2001:db8:2::/48
  p2p:
    ipv4: False
    ipv6: 2001:db8:3::/48
  core:
    ipv4: False
    ipv6: 2001:db8:4::/48

plugin: [ tunnel.wireguard ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ core, r3 ]
  ce:
    members: [ dut_r1, dut_r2 ]
    routing.static:
    - pool: core
      nexthop.node: core

module: [ ospf, routing ]

nodes:
  dut_r1:
  dut_r2:
  core:
    module: []
  r3:

links:
- group: core
  ospf: False
  role: core
  pool: core
  members: [ dut_r1-core, dut_r2-core ]
- group: site
  members: [ dut_r2-r3 ]
- dut_r1:
    tunnel.private_key: dwdtCnMYpX08FsFyUbJmRd9ML4frwJkqsXf7pR25LCo=
    tunnel.public_key: hSDwCYkwp1R0i33ctD73Wg2/Og0mOBr066SpjqqbTmo=
  dut_r2:
    tunnel.private_key: XasIfmJKikt54X+Lg4AO5m87sSkmGLb9HC+LJ/+I4Os=
    tunnel.public_key: 3p7bfXt9wbTTW2HC7OQ1Nz+DQ8hbeGdNrfx+FG+IK08=
  tunnel.mode: wireguard
  tunnel.source.link.role: core

validate:
  adj:
    description: Check OSPFv3 adjacencies
    wait: ospfv3_adj_p2p
    wait_msg: Waiting for OSPFv3 adjacency process to complete
    nodes: [ r3 ]
    plugin: ospf6_neighbor(nodes.dut_r2.ospf.router_id)
  pfx:
    description: Check for DUT_R1 loopback prefix being propagated to R3
    wait: ospfv3_spf_long
    wait_msg: Waiting for SPF to do its magic
    nodes: [ r3 ]
    plugin: ospf6_prefix(nodes.dut_r1.loopback.ipv6)
  ping:
    description: Check end-to-end IPv6 connectivity
    wait: ping
    wait_msg: Still waiting for SPF...
    nodes: [ r3 ]
    plugin: ping(nodes.dut_r1.loopback.ipv6,af='ipv6')
