---
message: |
  Test IPv6 GRE tunnels. The two tested devices have a GRE tunnel and run
  OSPFv3 over it. The probe (R3) should receive an OSPF route advertised
  from the remote device (DUT_R1) and be able to ping its loopback.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

addressing:
  loopback:
    ipv6: 2001:db8:0::/48
    prefix6: 128
  core:
    ipv4: false
    ipv6: 2001:db8:a::/48
  p2p:
    ipv6: 2001:db8:f::/48

plugin: [ tunnel.gre ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ core, r3 ]
  ce:
    members: [ dut_r1, dut_r2 ]
    routing.static:
    - pool: core
      nexthop.node: core

module: [ ospf, routing ]

nodes:
  dut_r1:
  dut_r2:
  core:
    module: []
  r3:

links:
- group: core
  ospf: False
  role: core
  pool: core
  members: [ dut_r1-core, dut_r2-core ]
- group: site
  members: [ dut_r2-r3 ]
- group: gre
  tunnel.mode: gre
  tunnel.af: ipv6
  tunnel.source.link.role: core
  members: [ dut_r1-dut_r2 ]

validate:
  adj_v3:
    description: Check OSPFv3 adjacencies
    wait: ospfv3_adj_p2p
    wait_msg: Waiting for OSPFv3 adjacency process to complete
    nodes: [ r3 ]
    plugin: ospf6_neighbor(nodes.dut_r2.ospf.router_id)
  pfx_v3:
    description: Check for DUT_R1 loopback prefix via OSPFv3 being propagated to R3
    wait: ospfv3_spf_long
    wait_msg: Waiting for SPF to do its magic
    nodes: [ r3 ]
    plugin: ospf6_prefix(nodes.dut_r1.loopback.ipv6)
  ping6:
    description: Check end-to-end connectivity IPv6
    wait: ping
    wait_msg: Still waiting for SPF...
    nodes: [ r3 ]
    plugin: ping(nodes.dut_r1.loopback.ipv6)
  adj_v2:
    description: Check OSPFv2 adjacencies
    wait: ospfv2_adj_p2p
    wait_msg: Waiting for OSPF adjacency process to complete
    nodes: [ r3 ]
    plugin: ospf_neighbor(nodes.dut_r2.ospf.router_id)
  pfx_v2:
    description: Check for DUT_R1 loopback prefix via OSPFv2 being propagated to R3
    wait: ospfv2_spf_long
    wait_msg: Waiting for SPF to do its magic
    nodes: [ r3 ]
    plugin: ospf_prefix(nodes.dut_r1.loopback.ipv4)
  ping4:
    description: Check end-to-end connectivity GRE 4 over 6
    wait: ping
    wait_msg: Still waiting for SPF...
    nodes: [ r3 ]
    plugin: ping(nodes.dut_r1.loopback.ipv4)
