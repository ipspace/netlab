---
message: |
  Test dual-stack WireGuard tunnels. The two tested devices have a WireGuard
  tunnel carrying both IPv4 and IPv6 and run OSPFv2 and OSPFv3 over it. The
  probe should receive the routes advertised from the remote device (DUT_R1)
  and be able to ping its loopback over both address families.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

addressing:
  loopback:
    ipv6: 2001:db8:1::/48
  lan:
    ipv6: 2001:db8:2::/48
  p2p:
    ipv6: 2001:db8:3::/48
  core:
    ipv4: 172.22.0.0/16
    ipv6: 2001:db8:4::/48

plugin: [ tunnel.wireguard ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ core, r3 ]
  ce:
    members: [ dut_r1, dut_r2 ]
    routing.static:
    - pool: core
      nexthop.node: core

module: [ ospf, routing ]

nodes:
  dut_r1:
  dut_r2:
  core:
    module: []
  r3:

links:
- group: core
  ospf: False
  role: core
  pool: core
  mtu: 1560
  members: [ dut_r1-core, dut_r2-core ]
- group: site
  members: [ dut_r2-r3 ]
- dut_r1:
    tunnel.private_key: dwdtCnMYpX08FsFyUbJmRd9ML4frwJkqsXf7pR25LCo=
    tunnel.public_key: hSDwCYkwp1R0i33ctD73Wg2/Og0mOBr066SpjqqbTmo=
  dut_r2:
    tunnel.private_key: XasIfmJKikt54X+Lg4AO5m87sSkmGLb9HC+LJ/+I4Os=
    tunnel.public_key: 3p7bfXt9wbTTW2HC7OQ1Nz+DQ8hbeGdNrfx+FG+IK08=
  tunnel.mode: wireguard
  tunnel.source.link.role: core

validate:
  adj:
    description: Check OSPFv2 adjacencies
    wait: ospfv2_adj_p2p
    wait_msg: Waiting for OSPF adjacency process to complete
    nodes: [ r3 ]
    plugin: ospf_neighbor(nodes.dut_r2.ospf.router_id)
  adj6:
    description: Check OSPFv3 adjacencies
    wait: ospfv3_adj_p2p
    wait_msg: Waiting for OSPFv3 adjacency process to complete
    nodes: [ r3 ]
    plugin: ospf6_neighbor(nodes.dut_r2.ospf.router_id)
  pfx:
    description: Check for DUT_R1 IPv4 loopback prefix being propagated to R3
    wait: ospfv2_spf_long
    wait_msg: Waiting for SPF to do its magic
    nodes: [ r3 ]
    plugin: ospf_prefix(nodes.dut_r1.loopback.ipv4)
  pfx6:
    description: Check for DUT_R1 IPv6 loopback prefix being propagated to R3
    wait: ospfv3_spf_long
    wait_msg: Waiting for SPF to do its magic
    nodes: [ r3 ]
    plugin: ospf6_prefix(nodes.dut_r1.loopback.ipv6)
  ping:
    description: Check end-to-end IPv4 connectivity
    wait: ping
    wait_msg: Still waiting for SPF...
    nodes: [ r3 ]
    plugin: ping(nodes.dut_r1.loopback.ipv4)
  ping6:
    description: Check end-to-end IPv6 connectivity
    wait: ping
    nodes: [ r3 ]
    plugin: ping(nodes.dut_r1.loopback.ipv6,af='ipv6')
  mtu:
    description: Check a full 1500-byte packet traverses the tunnel (underlay MTU 1560)
    nodes: [ r3 ]
    plugin: ping(nodes.dut_r1.loopback.ipv4,pkt_len=1472)
