---
message: |
  This topology tests the "netlab collect" functionality.
  You should:

  * Start the lab with "netlab up"
  * Save the configuration with "netlab collect --limit dut"
  * Stop the lab with "netlab down"

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]
defaults.paths.prepend.plugin: [ "topology:../plugin" ]

plugin: [ adjust_test ]

defaults.netlab.integration:
  validate: netlab collect                      # Execute "netlab collect" instead of validation

_adjust:
- nodes: [ dut ]
  features: [ initial.collect ]
  error: We cannot collect device configuration for the tested device

groups:
  probes:
    device: frr
    provider: clab
    members: [ x1 ]

nodes: [ dut, x1 ]
links: [ dut, x1 ]
