---
message: |
  This lab tests the (initial) device configuration through Linux scripts config.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

groups:
  probes:
    device: linux
    provider: clab
    members: [ x1 ]

nodes:
  dut:
    netlab_config_mode: sh
    id: 1
  x1:

links:
- dut-x1

validate:
  ping:
    description: Ping the tested device
    wait: ping_long
    wait_msg: Waiting for device interfaces to wake up
    nodes: [ x1 ]
    plugin: ping('dut')
