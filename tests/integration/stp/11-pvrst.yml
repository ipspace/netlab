message: |
  The devices under test form a layer-2 triangle of VLAN trunks. The devices
  are running PVRST and have different per-VLAN root priorities.

  If DUT_A and DUT_B run PVRST and has correct per-VLAN root priorities, DUT_A becomes the
  root bridge for red VLAN and DUT_B becomes the root bridge for the blue VLAN.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

# The root-election checks race the election on ArcOS. 'root_red' has no wait of its own, so it
# runs within a second or two of 'vlan_red' -- and 'vlan_red' passes as soon as ANY interface
# forwards, which is true long before the per-VLAN roots settle. Measured on ArcOS: both VLANs
# move to the configured roots 22 seconds after 'netlab up' returns.
#
# 'root_blue' is exposed to the same race. It is not protected by its own wait: 10, because a
# wait is a deadline measured from the previous waited test, so with no wait on 'root_red' the
# whole tail of the sequence bunches up behind 'vlan_red' -- both root checks have been observed
# failing together that way. Give each root check its own device-specific wait so the result does
# not depend on how much delay an earlier test happens to contribute.
defaults.devices.arcos.netlab_validate.root_red.wait: 40
defaults.devices.arcos.netlab_validate.root_blue.wait: 40

module: [ vlan, stp ]

groups:
  probes:
    members: [ x1 ]
    device: eos

vlans:
  red:
    mode: bridge
    id: 42
  blue:
    mode: bridge
    id: 76

stp.protocol: pvrst

nodes:
  dut_a:
    vlans:
      red:
        stp.priority: 4096  # High STP bridge priority (low value) -> becomes root
      blue:
        stp.priority: 32768
  dut_b:
    stp.priority: 12288
  x1:
    stp.priority: 16384

links:
- dut_a:
  x1:
  vlan.trunk: [ red, blue ]
- dut_b:
  x1:
  vlan.trunk: [ red, blue ]
- dut_a:
  dut_b:
  vlan.trunk: [ red, blue ]

validate:
  vlan_red:
    wait: 40
    wait_msg: Waiting for STP (VLAN red)
    nodes: [ x1 ]
    pass: At least one interface is in the forwarding state
    fail: No interfaces are in 'forwarding' state
    devices: [ eos ]
    show: spanning-tree | json
    valid: >-
      spanningTreeInstances.VL42.interfaces.Ethernet1.state == 'forwarding' or
      spanningTreeInstances.VL42.interfaces.Ethernet2.state == 'forwarding'

  root_red:
    nodes: [ x1 ]
    pass: DUT_A is root bridge in red VLAN
    fail: DUT_A is not the root bridge in red VLAN or has incorrect root priority
    devices: [ eos ]
    show: spanning-tree | json
    valid: >-
      spanningTreeInstances.VL42.rootBridge.priority == 4096

  vlan_blue:
    wait: 40
    wait_msg: Waiting for STP (VLAN blue)
    nodes: [ x1 ]
    pass: At least one interface is in the forwarding state
    fail: No interfaces are in 'forwarding' state
    devices: [ eos ]
    show: spanning-tree | json
    valid: >-
      spanningTreeInstances.VL76.interfaces.Ethernet1.state == 'forwarding' or
      spanningTreeInstances.VL76.interfaces.Ethernet2.state == 'forwarding'

  root_blue:
    wait: 10
    pass: DUT_B is root bridge in blue VLAN
    fail: DUT_B is not the root bridge in blue VLAN or has incorrect root priority
    devices: [ eos ]
    nodes: [ x1 ]
    show: spanning-tree | json
    valid: >-
      spanningTreeInstances.VL76.rootBridge.priority == 12288
