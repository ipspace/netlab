#
# ESI-LAG does not imply MLAG. A device that only declares evpn.multihoming.lag
# must not be allowed to create an MLAG peer-link.
# https://github.com/ipspace/netlab/issues/3835
#

defaults.device: none

module: [ lag ]

nodes:
  s1:
    _features.lag.mlag: False
    _features.evpn.multihoming.lag: True
  s2:
    _features.lag.mlag: False
    _features.evpn.multihoming.lag: True

links:
- lag:
    members: [ s1-s2 ]
    mlag.peergroup: true
