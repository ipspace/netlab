#
# A 2:1 LAG (M-side) requires MLAG or ESI-LAG on the pair of switches.
# s1/s2 support ESI-LAG, but the evpn.multihoming plugin is not used
#

defaults.device: none

module: [ lag ]

nodes:
  s1:
    _features.lag.mlag: False
  s2:
    _features.lag.mlag: False
  s3:
    _features.lag.mlag: False
    _features.evpn.multihoming.lag: False
  s4:
    _features.lag.mlag: False
    _features.evpn.multihoming.lag: False
  h1:
  h2:

links:
- lag.members: [ h1-s1, h1-s2 ]
- lag.members: [ h2-s3, h2-s4 ]
