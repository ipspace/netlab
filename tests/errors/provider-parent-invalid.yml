#
# The parent of a provider must be a provider name, and the device settings of a child
# provider must be a dictionary
#
defaults.providers.kube:
  parent: clab
  description: containerlab with an alternate runtime
defaults.providers.kube2:
  parent: [ clab ]
  description: parent provider is not a string
defaults.devices.eos.kube: False

provider: kube

nodes:
  r1:
    device: frr
