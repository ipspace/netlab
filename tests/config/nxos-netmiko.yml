plugin: [ files ]

nodes:
  sw:
    device: nxos
    provider: clab
    netlab_config_mode: netmiko

files:
  isis.j2: |
    feature isis
    router isis Gandalf
    !
    interface loopback0
      ip router isis Gandalf

  mtu.j2: |
    interface Ethernet 1/6
      mtu 5000

  invalid.j2: |
    interface Ethernet 0/0
      no shutdown

links: [ sw, sw ]
