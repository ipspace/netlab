---
description: CapeOS Bolt
device_caveats: caveats-capeos-bolt
support:
  level: minimal
interface_name: GigabitEthernet{ifindex}
loopback_interface_name: Loopback{ifindex}
mgmt_if: GigabitEthernet0
#
# CapeOS Bolt emulates the Cisco IOS CLI. The device uses the Cisco IOS configuration
# templates (ansible_network_os: ios) and netmiko settings, but does not inherit the
# Cisco IOS device features; the features below are the ones that work on CapeOS Bolt
#
group_vars:
  ansible_network_os: ios
  ansible_connection: network_cli
  ansible_become_method: enable
  ansible_user: admin
  ansible_ssh_pass: admin
  ansible_become_password: admin
  netlab_device_type: capeos_bolt
  netlab_config_mode: netmiko
  #
  # CapeOS Bolt rejects a few commands generated by the Cisco IOS templates (usually
  # because they're not needed). The wrapper removes the commands listed in the
  # 'netlab_ios_commands' dictionary unless they're set to True. It also replaces
  # the underscores in the hostname (CapeOS Bolt accepts only RFC 1123 hostnames)
  #
  # Use 'neighbor <cmd>' to remove BGP neighbor commands
  #
  netlab_ios_commands:
    ip routing: False
    no ip routing: False
    ip host: False
    ip domain lookup: False
    no ip domain lookup: False
    no cdp run: False
    no banner exec: False
    no banner incoming: False
    ip bgp-community new-format: False
    bgp update-delay: False
    bgp nopeerup-delay user-initiated: False
    bgp scan-time: False
    neighbor advertisement-interval: False
    neighbor send-community: False
    ipv6 prefix-list: False
    match ipv6 address: False
    do clear bgp: False
  netlab_config_wrapper: |
    {# Build the list of commands to remove: dictionary keys with values not set to True #}
    {% set skip_cmds = netlab_ios_commands|default({})|dictsort|rejectattr(1,'true')|map(attribute=0)|list %}
    {% for line in netlab_config_text.splitlines() %}
    {%   set w = line.split() %}
    {#   Ignore the neighbor address (second word) when matching BGP neighbor commands #}
    {%   set cmd = (w[:1] + w[2:]) if w[:1] == ['neighbor'] else w %}
    {#
         Skip the line if any of its leading word sequences ('ip', 'ip host', 'ip host x'...)
         is a removed command. We need a namespace to set a flag from within the loop
    #}
    {%   set skip = namespace(cmd=False) %}
    {%   for n in range(cmd|length) if cmd[:n+1]|join(' ') in skip_cmds %}
    {%     set skip.cmd = True %}
    {%   endfor %}
    {#   Copy the remaining lines, replacing the underscores in the hostname with hyphens #}
    {%   if not skip.cmd %}
    {{ line.replace('_','-') if w[:1] == ['hostname'] else line }}
    {%   endif %}
    {% endfor %}

features:
  bfd: True
  bgp:
    ipv6: False
    activate_af: True
    advertise: True
    aggregate: True
    allowas_in: True
    bfd: True
    default_originate: True
    import: [ ospf, connected, static ]
    local_as: True
    multihop: True
    password: True
    timers: True
    _default_locpref: True
  dhcp:
    client:
      ipv4: True
      routing: False
    relay: True
    server: True
  eigrp: False
  gateway:
    protocol: [ vrrp ]
  initial:
    ipv6: False
    hosts: False
    roles: [ host, router ]
    bandwidth: True
    min_mtu: 68
    max_mtu: 9216
    collect: True
    reload: custom
    config_mode: [ netmiko ]
  netmiko:
    device_type: cisco_ios
    collect:
      config: show running-config
      _config_skip: 3
    error_regexp:
    - (?i:invalid|incomplete|ambiguous|error|overlap|enabled|bad).*
    reload:
      config: flash:replace-config
      command: configure replace flash:replace-config force
      configure: |
        hostname { name.replace("_","-") }
        ip scp server enable
      file_transfer: True
  ospf:
    ipv6: False
    import: [ bgp, connected, static ]
    default: True
    priority: True
    timers: True
    areas:
      filter: CapeOS Bolt cannot configure 'not-advertise' area ranges
      external_range: CapeOS Bolt cannot configure NSSA type-7 ranges
      external_filter: CapeOS Bolt cannot suppress NSSA type-7 ranges
  routing:
    policy:
      set:
        locpref: True
        med: True
        weight: True
        prepend: True
        community:
          standard: True
          append: True
      match:
        prefix: True
    prefix.strict: True
    static:
      vrf: True
    acl: True
  vrf: {}

clab:
  image: ghcr.io/dkhenderson2/capeos-bolt:0.11.2
  docs_caveats: caveats-capeos-bolt
  interface.name: eth{ifindex}
  mtu: 1500                             # CapeOS data ports use 1500-byte MTU
  kmods:
    initial: [ 'vrf?' ]
  node:
    kind: linux
    config_templates:
      startup: /flash/startup-config
    env:
      CAPEOS_USER: admin
      CAPEOS_PASSWORD: admin
  group_vars:
    netlab_check_retries: 20
    netlab_ready: [ ssh ]
