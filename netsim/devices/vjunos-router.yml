---
description: vJunos Router (similar to vMX)
docname: Juniper vJunos-router
support:
parent: vmx
interface_name: ge-0/0/{ifindex}
tunnel_interface_name: "gr-0/0/10.{ifindex}"
group_vars:
  netlab_device_type: vjunos-router

features:
  evpn:
    asymmetrical_irb: true
    irb: true
    multi_rt: true
    bundle: [ vlan_aware ]
    transport: [ vxlan ]
  tunnel:
    gre: [ vrf, ipv4 ]
  vlan:
    model: router
    svi_interface_name: irb.{vlan}
    subif_name: "{ifname}.{vlan.access_id}"
    mixed_trunk: true
    native_routed: true
  vxlan: true

clab:
  image: vrnetlab/juniper_vjunos-router:26.2R1.7
  build: https://containerlab.dev/manual/kinds/vr-vjunosrouter/
  mtu: 1500
  node:
    kind: juniper_vjunosrouter
    env:
      CLAB_MGMT_PASSTHROUGH: "true"
  interface:
    name: eth{ifindex+1}
  group_vars:
    ansible_user: admin
    ansible_ssh_pass: admin@123

graphite.icon: router
