# SONiC on containerlab (docker-sonic-vs).
#
# netlab ships a `sonic` device that is LIBVIRT-ONLY (a full multi-container SONiC VM: FRR runs
# in a nested "bgp" sub-container, reached via `docker exec bgp vtysh`). This is a SEPARATE
# device for the community `docker-sonic-vs` image on containerlab, which is a MONOLITHIC single
# container: FRR's vtysh runs directly in the container's own namespace (no nested "bgp"
# container), and there is no sshd. We inherit interface naming / loopback naming / the base
# BGP feature set from `sonic` via `parent`, and add a `clab:` block that uses Ansible's built-in
# `docker` connection plugin (the same pattern already used in-tree by the `frr` and
# `cumulus_nvue` clab devices) instead of SSH — this is the netlab-idiomatic way to configure a
# clab container with no running sshd.
#
# docker-sonic-vs also ships most FRR daemons disabled by default (bgpd/ospfd/ospf6d/isisd/...
# =no in /etc/frr/daemons) to save resources; templates/initial/sonic_clab.j2 flips on the
# daemons needed by the configured modules and restarts FRR once, idempotently.
description: SONiC (containerlab, docker-sonic-vs)
parent: sonic
support:
  level: best-effort
  caveats:
  - >-
    Config deployment uses Ansible's 'docker' connection plugin (docker exec), not network_cli:
    docker-sonic-vs has no cliconf-compatible CLI (the only Ansible SONiC cliconf,
    dellemc.enterprise_sonic, targets Dell's licensed klish/Management-Framework CLI, which this
    image doesn't ship -- verified). See templates/initial/sonic_clab.j2 for the full writeup.
  - >-
    docker-sonic-vs ships sshd + host keys but starts neither sshd nor a login user;
    templates/initial/sonic_clab.j2 bootstraps both (admin / ansible_ssh_pass below) for
    interactive access ('netlab connect', ad-hoc troubleshooting) -- SSH is NOT used for config
    deployment, only ansible_connection: docker is.
  - docker-sonic-vs is a monolithic single container (FRR vtysh runs directly); this differs from
    the multi-container architecture of the full SONiC VM used by the parent 'sonic' device, so
    the initial template is not shared with the parent device and is provided here instead. BGP
    (and every other routing module) is delegated to the in-tree FRR templates via
    ansible_network_os=frr -- unlike the Azure/libvirt sonic image, docker-sonic-vs does not
    pre-seed a BGP AS, so no 'no router bgp' reset wrapper is needed.
  - >-
    Genuinely unsupported on this image, not just untested (each probed live): dhcp relay/client
    -- docker-sonic-vs ships no dhcrelay/dhcp6relay binary at all; stp -- config-plane only, no
    stpd daemon so there is no real port-blocking behavior to verify; mlag.vtep (anycast VTEP) --
    config-plane renders correctly (identical vtep-ip-global, underlay OSPF Full, BGP+EVPN
    Established) but the active-active EVPN overlay is platform-blocked (no mclagd, so BGP never
    resolves a usable self-next-hop for the anycast VTEP -- datapath 100% loss).
lag_interface_name: "PortChannel{lag.ifindex}"
tunnel_interface_name: "tun{ifindex}"   # tunnel.gre plugin naming (kernel netdev, ip_gre)
group_vars:
  netlab_device_type: sonic_clab
  netlab_frr_daemons:            # module -> FRR daemons to enable in /etc/frr/daemons (default: no)
    bgp: [ bgpd ]
    ospf: [ ospfd, ospf6d ]
    isis: [ isisd ]
    bfd: [ bfdd ]
    ripv2: [ ripd ]
    vrf: [ bgpd ]
    gateway: [ vrrpd ]
    mpls: [ ldpd ]
clab:
  # No netsim/templates/provider/clab/sonic_clab.j2 override exists (dev-guide checklist item):
  # the generic templates/provider/clab/clab.j2 already renders every clab.<key> below (image,
  # mtu, node.kind, ...) via its key-value passthrough loop (defaults.providers.clab.attributes.
  # node._keys) -- confirmed empirically, clab.yml rendered correctly with no provider template
  # of our own. A provider override is only needed for device-specific containerlab topology
  # shapes (bind mounts, exec hooks, etc.); this device needs none of that.
  image: docker-sonic-vs:latest
  mtu: 1500
  node:
    kind: sonic-vs
  # SONiC runs FRR, so reuse FRR's kernel-module handling. Declaring 'kmods' opts this device
  # into netlab's clab kernel-module loader (netsim/providers/clab/labops.py), which merges these
  # with the system-wide providers.clab.kmods -- so an 'mpls'/'sr' lab auto-loads mpls_router +
  # mpls_iptunnel (real kernel label FIB), 'vxlan' loads the vxlan modules, and 'vrf' loads the
  # vrf module, with no manual 'modprobe'. Mirrors netsim/devices/frr.yml.
  kmods:
    initial: [ 'vrf?' ]
  group_vars:
    ansible_connection: docker
    ansible_user: root
    ansible_ssh_pass: YourPaSsWoRd                     # bootstrapped 'admin' login, interactive use only
    netlab_ready: [ ansible ]                          # skip the SSH readiness wait (sshd isn't up yet)
    netlab_show_command: [ vtysh, -c, 'show $@' ]
# The feature flags below are established by live testing across the module templates in
# tests/integration/platform/sonic_clab/; see those topologies for what each one verifies.
features:
  initial:
    collect: true          # ansible_connection: docker unblocks this (no sshd needed) -- verified live
  bgp:
    import: [ connected, static, ospf ]   # redistribute-into-BGP (frr.j2 renders it)
    advertise: true                       # bgp.originate: static discard route backs the prefix
    password: true                        # bgp.session plugin (MD5)
    timers: true
    gtsm: true
    passive: true
    bfd: true
    multihop:                             # ebgp.multihop plugin (FRR-delegated)
      vrf: true
  ospf:
    unnumbered: true
    default: true
    areas: true
    timers: true
    priority: true
    password: true
    bfd: true
  isis:
    circuit_type: true
    unnumbered: { ipv4: true, ipv6: true, network: true }
    import: [ static ]
  mpls:
    ldp: true            # LDP control-plane; no kernel MPLS label FIB in a clab container
    vpn: true             # unlocks BGP VPNv4/VPNv6 L3VPN import
  sr:
    af: [ ipv4, ipv6 ]    # SR-MPLS via IS-IS; SIDs flooded/visible in the IS-IS LSDB
    protocol: [ isis ]
  srv6:
    isis: true            # kernel seg6 (net.ipv6.seg6_enabled), not the MPLS label FIB
  vrf:
    keep_module: true
    ospfv2: true
    ospfv3: true
    bgp: true
    isis: true
  bfd: true
  lag:
    passive: true
    mlag:
      peer:
        ip: 169.254.127.0/31   # static /31 peer-link (EOS pattern); SONiC has no MLAG keepalive
                                # protocol to negotiate one over -- config-plane only (no mclagd)
  ripv2:
    ipv4: true
  gateway:
    protocol: [ vrrp ]
  routing:
    static:
      vrf: true
      discard: true        # Null0 blackhole (backs bgp.originate)
    prefix: true
    aspath: true
    community:
      standard: true
      large: true
    policy:
      match:
        prefix: true
        aspath: true
        community:
          standard: true
      set:
        locpref: true
        med: true
        prepend: true
        weight: true
        community:
          standard: true
  vxlan: true              # L2VNI via FRR/kernel path (orchagent can't program the VS dataplane)
  evpn:
    transport: [ vxlan, mpls ]
    irb: true               # symmetric IRB / L3VNI -- kernel VRF + vxlan L3VNI transit device
    multihoming:             # evpn.multihoming plugin: ESI-LAG on PortChannel (teamd) via zebra
      lag: true
      interface: false
      esi_auto: true
      modes: [ 'all-active' ]
  vlan:
    model: l3-switch         # access switchports + SVIs
    svi_interface_name: "Vlan{vlan}"   # config_db object name -- CAPITAL V; the config CLI
                                        # rejects netlab's default lowercase vlan<id>
  tunnel:
    gre: true                # tunnel.gre plugin: kernel ip_gre/ip6_gre, FRR-delegated bash
                              # template (extra/tunnel/gre/frr.j2) -- reused as-is, no override
# Deliberately NOT declared (genuinely unsupported on this image, not just untested -- see the
# 'support.caveats' entry above for the live-probed reason): dhcp relay/client, stp real
# port-blocking, mlag.vtep active-active datapath.
graphite.icon: switch
