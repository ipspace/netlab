---
description: Mikrotik RouterOS version 6
docname: Mikrotik RouterOS 6
support:
  level: obsolete
interface_name: ether{ifindex}
mgmt_if: ether1
ifindex_offset: 2
loopback_interface_name: loopback
libvirt:
  image: mikrotik/chr
  docs_caveats: caveats-routeros6
  node:
    cpu: 1
    memory: 256
  build: https://stefano.dscnet.org/a/mikrotik_vagrant/
group_vars:
  ansible_network_os: routeros
  ansible_connection: network_cli
  ansible_user: admin
  ansible_ssh_pass: admin
features:
  initial:
    hosts: False
    caveats.lldp: caveats-routeros6
    collect: true
  bgp: true
  mpls:
    ldp:
      explicit_null: true
    vpn:                      # The template configures VPNv4 only
      ipv4: true
  ospf:
    ipv6: False
  vlan:
    model: router
    svi_interface_name: bridge{vlan}
    subif_name: "{ifname}-{vlan.access_id}"
    mixed_trunk: true
    native_routed: true
  vrf:
    ospfv2: True
    ospfv2_caveats: caveats-routeros6
    bgp: True
    loopback: False
external:
  image: none
graphite.icon: router
