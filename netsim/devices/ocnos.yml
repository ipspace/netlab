---
# IP Infusion OcNOS (OcNOS-SP virtual machine) -- containerlab ipinfusion_ocnos kind, built with vrnetlab.
#
# Tested with OcNOS-SP-PLUS-x86-7.0.0-262-GA (the free OcNOS VM) packaged by vrnetlab/ipinfusion/ocnos.
# Data ports are eth1..ethN (container ethN maps 1:1), eth0 is the management port in the "management" VRF.
# The loopback interface "lo" already carries 127.0.0.1, so netlab loopback addresses are added as secondary.
# Configuration is pushed over SSH with netmiko (ipinfusion_ocnos driver, which commits the transaction).
# The ipinfusion.ocnos Ansible collection (ocnos_config) is the alternative deployment method.
description: IP Infusion OcNOS
interface_name: eth{ifindex}
mgmt_if: eth0
loopback_interface_name: '{"loopback" + str(ifindex) if ifindex else "lo"}'
role: router
support:
  level: minimal
group_vars:
  netlab_device_type: ocnos
  ansible_network_os: ipinfusion.ocnos.ocnos
  ansible_connection: network_cli
  ansible_user: admin
  ansible_ssh_pass: admin@123
  netlab_check_retries: 30
  netlab_check_delay: 10
  netlab_config_mode: netmiko
features:
  initial:
    ipv4:
      unnumbered: false
    ipv6:
      lla: false
    config_mode: [ netmiko ]
    collect: true
  netmiko:
    device_type: ipinfusion_ocnos
    error_regexp:                 # OcNOS errors start with '%'; '% Warning' lines are informational
    - "^%(?! Warning).*"
    step_config: true
  bfd: true
  bgp:
    activate_af: true
    advertise: true
    bfd: true
    import: [ connected, static, isis, ospf, vrf ]
    local_as: true
    multihop: true
    password: true
    timers: true
    vrf_local_as: true
  isis:
    circuit_type: true
  ospf:
    areas:
      external_range: OcNOS template does not configure NSSA type-7 ranges
      external_filter: OcNOS template does not configure NSSA type-7 range suppression
    default: true
    password: true
    priority: true
    timers: true
  routing:
    static:
      discard: true
      vrf: true
  stp:
    supported_protocols: [ stp, rstp, mstp ]
    enable_per_port: true
  vlan:
    model: switch
    svi_interface_name: "vlan1.{vlan}"
  vrf:
    ospfv2: true
    ospfv3: true
    bgp: true
    leaking_caveats: True
clab:
  image: vrnetlab/ipinfusion_ocnos:7.0.0-262
  build: https://containerlab.dev/manual/kinds/ipinfusion-ocnos/
  features:
    initial:
      healthcheck: true
  node:
    kind: ipinfusion_ocnos
  interface:
    name: eth{ifindex}
graphite.icon: router
