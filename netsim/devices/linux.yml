description: Generic Linux host
docname: Linux
docparent: False                    # Do not use as a parent device in feature support tables
interface_name: eth{ifindex}
lag_interface_name: "bond{lag.ifindex}"
loopback_interface_name: lo{ifindex if ifindex else ""}
mgmt_if: eth0
role: host
features:
  initial:
    collect: false
    reload: false
    ipv4:
      unnumbered: peer
    ipv6:
      lla: true
      use_ra: true
    roles: [ host ]
  lag:
    passive: False
  netmiko:
    device_type: linux
    config:
      method: script                # Copy config scripts to the device and execute them
      directory: /tmp
      become: true
  routing:
    static: true
libvirt:
  image: bento/ubuntu-24.04
  node:
    cpu: 1
    memory: 1024
  build_recipe: https://netlab.tools/labs/linux/    # Documentation only (the box is downloadable)
  create_image: netlab/linux
  create_template: frr.xml.j2
  create_iso: linux
  group_vars:
    netlab_linux_distro: ubuntu
  features:
    initial:
      config_mode: [ netmiko ]
    dhcp:
      client:
        ipv4: true
        ipv6: true
      server: true
      relay:
        ipv4: true
      caveats.relay: linux-dhcp-relay
group_vars:
  ansible_network_os: linux
  ansible_connection: ssh
  ansible_user: vagrant
  ansible_ssh_pass: vagrant
  docker_shell: sh -il
  ansible_python_interpreter: auto_silent
  netlab_lldp_enable: False
  netlab_net_tools: False
clab:
  build_recipe: https://netlab.tools/labs/linux/    # Documentation only (the container is downloadable)
  node_config:
    initial: :ns
    lag: :ns
    vlan: :ns
    routing: :ns
    services: :sh
  features:
    initial:
      roles: [ host, bridge ]
      generate_mac: [ svi ]
      config_mode: [ sh ]
    vlan:
      mixed_trunk: true
      model: router
      native_routed: true
      subif_name: '{ifname}.{vlan.access_id}'
      svi_interface_name: vlan{vlan}
    services:
      dns:
        ipv4: True
        ipv6: True
        transport_vrf: False
  image: python:3.13-alpine
  docs_caveats: clab-linux
  mtu: 1500
  kmods:
  node:
    kind: linux
    config_templates:
      hosts: /etc/hosts:shared
  group_vars:
    ansible_connection: docker
    ansible_user: root
    netlab_linux_distro: vanilla
external:
  image: none
graphite.icon: server
