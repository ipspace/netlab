---
description: Cisco IOSv
parent: ios
support:
  level: minimal
  caveats:
  - Most SSH libraries no longer support the ancient algorithms used by Cisco IOSv
interface_name: GigabitEthernet0/{ifindex}
group_vars:
  netlab_device_type: ios
  ansible_user: vagrant
  ansible_ssh_pass: vagrant
  ansible_become_password: vagrant
libvirt:
  image: cisco/iosv
  docs_caveats: cisco-ios-ssh
  node:
    cpu: 1
    memory: 512
    nic_model_type: e1000
  build: https://netlab.tools/labs/iosv/
  create_template: iosv.xml.j2
features:
  vlan.caveats.bridging: caveats-iosv
  dhcp.server_vrf: false
  initial:
    min_mtu: 64
    max_mtu: 9600
  bgp:
    tcp_ao: false

clab:
  image: vrnetlab/cisco_vios:15.9.3
  docs_caveats: cisco-ios-ssh
  features:
    initial:
      healthcheck: true
  node:
    kind: cisco_vios
  interface.name: eth{ifindex}
  build: https://github.com/srl-labs/vrnetlab/tree/master/vios
