#
# network_xray tool
# https://github.com/rclab-dev/network-xray
#
---
description: Lab topology and routing state visualizer
runtime: docker     # Default: start in a Docker container
docker:
  up:
    docker run -d --rm
      --name "{name}_network_xray"
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$(pwd)":/lab:ro
      -p { 8600 + defaults.multilab.id if defaults.multilab.id else 8600 }:8600
      ghcr.io/rclab-dev/network-xray:1
      --topo /lab/clab.yml
  message: >-
    Open http://{sys.ipurl}:{ 8600 + defaults.multilab.id if defaults.multilab.id else 8600 }/ in your browser
  down:
    docker kill '{name}_network_xray'
