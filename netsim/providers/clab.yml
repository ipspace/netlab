#
# CLAB settings
#
description: containerlab with Docker
config: clab.yml
lab_prefix: "clab"                      # Containerlab default, set to "" to remove prefix
mgmt_default_ipv6: fd00:df:1ab::/64     # Needed for old vrnetlab containers with Transparent Management
node_config_special: [ binds, config_templates, image, kind, startup-config, srl-agents, start_after ]
reserved_names: [ host, macvlan, ipvlan ]
template: clab.j2
version: "0.80.0"       # Triple-check the exact release tag containerlab is using when changing this :(
start: containerlab deploy --reconfigure -t clab.yml
stop: containerlab destroy --cleanup -t clab.yml
act_probe: "docker ps"
act_title: "Running containers"
probe:
- cmd: "containerlab version"
  err: "Containerlab is not installed"
- cmd: "docker version"
  err: >-
    Cannot run 'docker version'. Install Docker or podman-docker and
    ensure you can access the Docker/Podman socket.
- cmd: [ bash, '-c', "(groups | grep -w clab_admins) || (whoami | grep -w root)"]
  err: >-
    You are not a member of the clab_admins group.
    See https://netlab.tools/labs/clab/ for details
- cmd: [ bash, '-c', "[[ `containerlab version|awk '/version/ {print $2}'` > '0.79.99' ]] && echo OK" ]
  err: "Containerlab version is too old, please upgrade to 0.80.0 or later with 'sudo containerlab version upgrade'"

cleanup: [ clab.yml, clab_files ]
bridge_type: bridge # Use 'ovs-bridge' to create Openvswitch bridges
runtime: docker     # Default runtime, see Containerlab documentation
kmods:
  lag: [ bonding ]
  mpls: [ mpls-router, mpls-iptunnel ]
  sr:  [ mpls-router, mpls-iptunnel ]
  vxlan: [ vxlan, udp_tunnel, ip6_udp_tunnel ]
  vrf: [ vrf ]
attributes:
  node:
    type: dict
    _keys:          # Make keys explicit to get around the 'type' attribute
      binds:
      kind: str
      config_templates: dict
      type: str
      cmd: str
      dns:
      env:
      ports: list
      image: str
      startup-config: str
      start_after:
        type: list
        _subtype: node_id
      stages:
        type: dict
        _keytype: { type: str, valid_values: [ create, create-links, configure, healthy, exit ]}
        _subtype: _clab_stage
      srl-agents:
      license: str
      runtime: str
      startup-delay: int
      restart-policy: str
      network-mode: str
      exec: { type: list, _subtype: str }
  interface:
    name: str
  link:
    uplink: str
    provider: dict
