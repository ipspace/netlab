---
- name: Generate gNMI YAML configuration
  set_fact:
    yaml_config: "{{ lookup('template',config_template) }}"

- name: Update {{ netsim_action }} node configuration from gNMI template {{ config_template  }}
  when: d != [] or u != [] or r != []
  vars:
    raw_cfg: "{{ yaml_config | from_yaml }}"
    cfg: "{{ raw_cfg if raw_cfg is mapping else {} }}"
    d: "{{ (cfg.get('delete') or cfg.get('deletes')) | default([], true) }}"
    u: "{{ (cfg.get('updates') or cfg.get('update')) | default([], true) }}"
    r: "{{ (cfg.get('replace') or cfg.get('replaces')) | default([], true) }}"
    ansible_connection: nokia.openconfig.grpc
    ansible_gnmi_encoding: JSON
    ansible_port: "{{ sros_grpc_port }}"
  nokia.openconfig.gnmi_set:
    prefix: "{{ cfg.get('prefix') | default(omit, true) }}"
    origin: "{{ cfg.get('origin') if cfg.get('origin') is not none else omit }}"
    delete: "{{ d }}"
    replace: "{{ r }}"
    update: "{{ u }}"
  register: gnmi_set_result
  tags: [ print_action, always ]

- debug: var=gnmi_set_result
  when: ansible_verbosity > 0
