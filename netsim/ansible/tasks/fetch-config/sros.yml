#
# Fetch SR OS configuration using gNMI
#
- name: Backup SR OS node config user={{ ansible_user }}
  vars:
   ansible_connection: nokia.openconfig.grpc
   ansible_gnmi_encoding: JSON
   ansible_port: "{{ sros_grpc_port }}" # Uses gNMI over this port

  nokia.openconfig.gnmi_set:
   backup: yes
   backup_options:
    dir_path: "{{ config_dir }}"
    filename: "{{ inventory_hostname }}.{{ cfg_suffix }}"
  register: backup_info
  changed_when: no

- name: SR OS backup details
  debug:
   msg: "{{ backup_info }}"
