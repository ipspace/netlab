# EIGRP default settings and attributes
#
# Supported on: csr, iosv, nxos
#
---
transform_after: [ vlan, vrf ]
config_after: [ vlan, routing ]
as: 1
attributes:
  global:
    af:
      _list_to_dict: True
      _alt_types: [ NoneType ]
      ipv4: bool
      ipv6: bool
    as: asn
  node:
    af:
    as:
  link:
    passive: bool
features:
  ipv4: IPv4 address family
  ipv6: IPv6 address family
feature_defaults:                                 # Features supported unless a device sets them to False
  ipv4: True
  ipv6: True
warnings:
  inactive: True
