# EVPN default settings and attributes
#
requires: [ bgp ]
no_propagate: [ start_transit_vni, transport, vlan_bundle_service, as ]
transform_after: [ vlan, vxlan, vrf ]
config_after: [ vlan, vxlan, vrf ]
session: [ ibgp ]
start_transit_vni: 200000
attributes:
  global:
    session: [ ibgp, ebgp ]
    start_transit_vni: { type: int, min_value: 4096, max_value: 16777215 }
    transport: { type: str, valid_values: [ vxlan, mpls, sr ] }
    vlans: list
    vrfs: list
    as: asn
  bundle: [ vlan_aware, vlan, port, port_vlan ]
  node:
    session:
    vlans:
    vrfs:
    domain: str
  vlan:
    evi: { type: int, min_value: 1, max_value: 65535 }
    rd: rd
    import: list
    export: list
  node_vlan:
    import: { copy: vlan }
    export: { copy: vlan }
  vrf:
    evi: { type: int, min_value: 1, max_value: 65535 }
    transit_vni: { type: int, min_value: 4096, max_value: 16777215, _alt_types: [ str, bool ] }
    bundle: { type: str, valid_values: [ vlan_aware, vlan, port, port_vlan ]}
features:
  irb: Supports symmetrical IRB (routing on ingress and egress)
  asymmetrical_irb: Support asymmetrical IRB (routing on ingress, bridging on egress)
  bundle: EVPN bundle service support
  multi_rt: Multiple import/export route targets
  transport: Supported data-plane encapsulations
  bgp_session: Supported BGP session types per transport (control-plane support)
  ipv6: EVPN with IPv6 next hops (VXLAN over IPv6)
  multihoming.lag: Ethernet segments on LAG interfaces (evpn.multihoming plugin)
  multihoming.interface: Ethernet segments on physical interfaces (evpn.multihoming plugin)
  multihoming.esi_auto: Automatic ESI values based on LACP system ID (evpn.multihoming plugin)
