# Network services default settings and attributes
#
---
transform_after: [ vrf ]
config_after: [ vrf ]
dns:
  domain: netlab.local
attributes:
  global:
    dns:
      server: { type: list, _subtype: node_id }
      ipv4:
        type: list
        _subtype: { type: ipv4, use: address }
      ipv6:
        type: list
        _subtype: { type: ipv6, use: address }
      domain: str
      transport_vrf: id
    syslog:
      server: { type: list, _subtype: node_id }
      ipv4:
        type: list
        _subtype: { type: ipv4, use: address }
      ipv6:
        type: list
        _subtype: { type: ipv6, use: address }
      transport_vrf: id
  node:
    dns: { copy: global }
    syslog: { copy: global }
    server:
      dns:
        type: dict
        _keys:
          forwarder:
            ipv4:
              type: list
              _subtype: { type: ipv4, use: address }
            ipv6:
              type: list
              _subtype: { type: ipv6, use: address }
        true_value: {}
        _remove_when_false: True
      syslog: bool
  clients: [ dns, syslog ]              # List of supported services clients

features:
  dns: DNS client
  syslog: syslog client
  server.dns: DNS server
  server.syslog: syslog server
