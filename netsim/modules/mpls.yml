# MPLS (LDP, BGP LU, L3VPN, 6PE) default settings and attributes
#
---
config_after: [ vlan, ospf, isis, bgp ]
transform_after: [ vlan, bgp, vrf ]
ldp: True
attributes:
  global:
    ldp:
      _alt_types: [ bool ]
      router_id: { type: ipv4, use: id }
      igp_sync: bool
      explicit_null: bool
      advertise: list
    bgp:
      _alt_types: [ bool, BoxList ]
      ipv4: { type: list, true_value: [ ibgp, ebgp ] }
      ipv6: { type: list, true_value: [ ibgp, ebgp ] }
      explicit_null: bool
      disable_unlabeled: bool
    vpn:
      _alt_types: [ bool, BoxList ]
      ipv4: { type: list, true_value: [ ibgp ] }
      ipv6: { type: list, true_value: [ ibgp ] }
    6pe: { type: list, true_value: [ ibgp ], valid_values: [ ibgp, ebgp ] }
  node:
    ldp:
    bgp:
    vpn:
    6pe:
  link:
    ldp: bool
features:
  ldp: Can run LDP within an autonomous system
  bgp: Supports BGP Labeled Unicast address family
  vpn: Supports MPLS/VPN
  6pe: Supports 6PE
  ldp.explicit_null: Supports LDP explicit null labels
  ldp.igp_sync: Supports LDP/IGP synchronization
  bgp.ipv4: Supports IPv4 BGP Labeled Unicast
  bgp.ipv6: Supports IPv6 BGP Labeled Unicast
  bgp.explicit_null: Supports explicit null labels on BGP-LU sessions
  bgp.disable_unlabeled: Can disable unlabeled BGP address families
