---
description: dnsmasq - DNS and DHCP server
docname: dnsmasq
packages:
  dnsmasq: dnsmasq
daemon_config:
  dnsmasq: /etc/dnsmasq.conf                # dnsmasq configuration (including DHCP config)
  dhcp: /etc/dhcp.ignore                    # Empty file to keep everyone happy
  services: /etc/services.ignore            # ... same for services
node:
  module: [ dhcp, services ]
clab:
  group_vars:
    docker_shell: bash -il
  image: netlab/dnsmasq:latest
  build: True
  node:
    config_templates:
      start: /etc/netlab-start.sh
      rsyslogd: /etc/rsyslog.d/50-default.conf
  features:
    initial:
      roles: [ host ]
      config_mode: [ sh ]

libvirt:                        # Not yet available on libvirt
  image:
features:
  dhcp:
    server: true
  initial:
    reload: false
    roles: [ host ]
  services:
    dns: true
    server:
      dns: true
      syslog: true
dhcp:
  server: true
services:
  server:
    dns: true
    syslog: true
