---
description: DNSmasq - DNS and DHCP server
packages:
  dnsmasq: dnsmasq
daemon_config:
  dnsmasq: /etc/dnsmasq.conf                # dnsmasq configuration (including DHCP config)
  dhcp: /etc/dhcp.ignore                    # Empty file to keep everyone happy
  services: /etc/services.ignore            # ... same for services
node:
  module: [ dhcp, services ]
clab:
  group_vars:
    docker_shell: bash -il
  image: netlab/dnsmasq:latest
  build: True
  features:
    initial:
      roles: [ host ]
      config_mode: [ sh ]

libvirt:                        # Not yet available on libvirt
  image:
features:
  dhcp:
    server: true
  initial:
    reload: false
    roles: [ host ]
  services:
    dns: true
    server.dns: true
dhcp:
  server: true
services:
  server.dns: true
