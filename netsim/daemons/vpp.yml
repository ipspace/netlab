---
description: VPP fd.io container
parent: linux
role: router
interface_name: eth{ifindex}
mgmt_if: eth0
loopback_interface_name: loop{ifindex}
vpp_control_plane: bird
routing:
  _rm_per_af: True
group_vars:
  ansible_python_interpreter: auto_silent
daemon_config:
  vpp: /etc/vpp/startup.conf
  mpls: /etc/vpp/config/mpls.vpp
clab:
  node.cmd: /etc/dataplane-wait.sh
  node.config_templates:
    dataplane-wait: /etc/dataplane-wait.sh:sh
    setup@vpp: /etc/vpp/config/setup.vpp
    start@vpp: /usr/local/bin/netlab-start.sh:sh
  node_config:
    initial: /etc/config/01-initial.sh:sh
  group_vars:
    ansible_connection: docker
    ansible_user: root
    docker_shell: bash -il
    netlab_config_mode: sh
    netlab_dp_module: [ initial ]
    netlab_start_daemon: "/usr/local/bin/netlab-start.sh"
  image: netlab/vpp:latest
  # image: git.ipng.ch/ipng/vpp-containerlab:stable
  build: True
  # node:
  #  kind: fdio_vpp
  sw_version: # Marks versioning support, latest release is used by default
  repo: release
  mtu: 1500
  features:
    initial:
      config_mode: [ sh ]
      roles: [ router, bridge ]
libvirt:
  image:
virtualbox:
  image:
features:
  initial:
    ipv4:
      unnumbered: true
    ipv6:
      lla: true
      use_ra: true
    ra: true
    reload: false
    roles: [ router, bridge ]
external:
  image: none
graphite.icon: router

attributes:
  node:
    vpp_control_plane: { type: str, valid_values: [ bird, frr ] }
