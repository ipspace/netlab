---
description: VPP fd.io container
parent: linux
role: router
interface_name: eth{ifindex}
mgmt_if: eth0
loopback_interface_name: lo{ifindex if ifindex else ""}
routing:
  _rm_per_af: True
group_vars:
  ansible_python_interpreter: auto_silent
  netlab_initial: always
daemon_config:
  vpp: /etc/vpp/startup.conf
  initial: /etc/vpp/setup.conf
clab:
  group_vars:
    ansible_connection: docker
    ansible_user: root
    docker_shell: bash -il
    netlab_config_mode: ns
  image: netlab/vpp:latest
  build: True
  sw_version: # Marks versioning support, latest release is used by default
  repo: release
  mtu: 1500
  features:
    initial:
      config_mode: [ ns ]
      roles: [ host, router, bridge ]
libvirt:
  image:
virtualbox:
  image:
features:
  initial:
    ipv6:
      lla: true
      use_ra: true
    ra: true
    reload: false
    roles: [ host, router, bridge ]
external:
  image: none
graphite.icon: router
