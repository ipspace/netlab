# WireGuard tunnels attributes and defaults
#
---
devices:
  frr:
    features.tunnel.wireguard: True

attributes:
  link:
    tunnel:
      af:                     # Transport address family
        { type: str, valid_values: [ ipv4, ipv6 ] }
      mode:                   # Every tunnel plugin must define tunnel.mode link attribute
        _required: True
        type: str
        valid_values:
          wireguard:          # ... and add its tunnel type as a valid value
      private_key:            # This node's WireGuard private key
        type: str
      public_key:             # This node's WireGuard public key
        type: str
      listen_port:            # UDP port used to accept WireGuard connections
        type: int
        min_value: 1
        max_value: 65535
        _default: 51820
      allowed_ips:            # Allowed IPs for the remote peer
        type: str
      persistent_keepalive:   # Keepalive interval in seconds
        type: int
        min_value: 0
      mtu:                    # Tunnel interface MTU
        type: int
        min_value: 1280
      source:                 # Define the source interface of the tunnel underlay
        type: dict
        _keys:
          ifindex: int        # You could specify ifindex if you know it
          type:               # Source interface type (used to specify loopbacks)
            { type: str, valid_values: [ loopback ] }
          link:
            name: str         # You could also specify the link name
            role: id          # ... or link role
      vrf: str                # Specify the transport VRF
