# evpn.multihoming: Support EVPN Multihoming (Ethernet Segments)
#
---
# data model:
# -- global: evpn.ethernet_segments
# -- on interface: es: xxx (must be a valid ethernet_segment reference)
evpn:
  attributes:
    global:
      ethernet_segments:
        type: dict
        _keytype: id
        _subtype: _es_item
    node:
      ethernet_segments: { copy: global }
    interface:
      es: id
    # specific attributes
    _es_item:
      auto: bool
      id: esi_value
