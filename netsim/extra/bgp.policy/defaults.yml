# bgp.policy default settings -- mostly attributes
#
---
#
# The device settings are mostly inherited from the 'routing' module, the only
# extra settings you can specify here are 'bandwidth' and '_default_locpref'
#

attributes:
  bgp_role:
    name:
      _required: True
      type: str
      valid_values: [ provider, customer, peer, rs-server, rs-client ]
    strict:
      type: bool

bgp:
  attributes:
    p_attr:                                               # BGP policy attributes
      direct: [ weight, prefix_filter, as_filter ]        # Things that can be applied directly to a neighbor
      node: [ locpref ]
      link: [ locpref, med, role ]
      interface: [ locpref, med, prepend, weight, role ]
      compound:                                           # Things that have to be applied to in/out policy
        locpref: in
        med: out
        prepend: out
        bandwidth: both

    role:
      attr: [ role ]
    global:
      role:
        _description: |
          Local BGP Role for the EBGP session (RFC 9234). Negotiated in the BGP OPEN
          message to prevent route leaks; enables automatic Only-to-Customer handling.
          Specify a role name or a dictionary with **name** and optional **strict** set to
          _true_ for RFC 9234 strict mode. Global strict mode can be enabled with
          **defaults.bgp.role.strict**.
        type: str
        valid_values: [ provider, customer, peer, rs-server, rs-client ]
        _alt_types: [ bgp_role ]
    node:
      role:
        copy: global
      aggregate:
        type: list
        _subtype:
          ipv4: { type: ipv4, use: prefix }
          ipv6: { type: ipv6, use: prefix }
          summary_only: bool
          suppress_policy: str
          attributes: str
          _alt_types: [ prefix_str ]
    link:
      role:
        copy: global
    interface:
      policy:
        in: str
        out: str
      bandwidth:
        _alt_types: [ autobw ]
        in: autobw
        out: autobw
      role:
        copy: global
    vrf:
      aggregate:
        copy: node
