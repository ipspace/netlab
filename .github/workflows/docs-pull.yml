---
name: Build documentation and check error message documentation URLs

on:
  pull_request:
    paths:
    - 'docs/**'
    - 'netsim/**'
    - 'tests/check-doc-urls.py'
    - '.github/workflows/docs-pull.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r docs/requirements.txt
    - name: Build documentation (fail on warnings)
      run: |
        PYTHONPATH=. sphinx-build -W --keep-going -b html docs _build/html
    - name: Check documentation URLs used in error messages
      run: |
        python3 tests/check-doc-urls.py _build/html
